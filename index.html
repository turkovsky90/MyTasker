function getBlockAtPoint(editor, x, y){
  let node = null;
  try {
    if(document.caretRangeFromPoint){
      const range = document.caretRangeFromPoint(x, y);
      if(range) node = range.startContainer;
    } else if(document.caretPositionFromPoint){
      const pos = document.caretPositionFromPoint(x, y);
      if(pos) node = pos.offsetNode;
    }
  } catch(_){ return null; }
  if(!node) return null;
  if(node.nodeType === 3) node = node.parentNode;
  if(!editor.contains(node)) return null;
  let block = node;
  while(block && block !== editor && block.parentNode !== editor) block = block.parentNode;
  if(block && block !== editor && block.parentNode === editor) return block;
  return null;
}

function attachEditorHandlers(editor){
  editor.addEventListener('input', () => { updateDescFromEditor(); updateToolbarState(); updateLastCaretBlock(); });
  editor.addEventListener('keyup', () => { updateToolbarState(); updateLastCaretBlock(); });
  editor.addEventListener('mouseup', () => { updateToolbarState(); updateLastCaretBlock(); });
  editor.addEventListener('click', updateLastCaretBlock);

  editor.addEventListener('click', e => {
    const chk = e.target.closest('.md-chk');
    if(!chk) return;
    e.preventDefault();
    const block = chk.closest('.md-check');
    if(!block) return;
    const checked = block.getAttribute('data-check')==='1';
    block.setAttribute('data-check', checked?'0':'1');
    block.classList.toggle('done', !checked);
    chk.textContent = checked ? '[ ]' : '[x]';
    updateDescFromEditor();
  });

  editor.addEventListener('keydown', e => {
    if(e.key === 'Backspace'){
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if(!range.collapsed) return;

      let node = range.startContainer;
      if(node.nodeType === 3 && range.startOffset !== 0) return;
      if(node.nodeType === 1 && range.startOffset !== 0) return;
      if(node.nodeType === 3) node = node.parentNode;
      if(!node) return;
      if(node.closest && node.closest('.md-chk')) return;

      let topBlock = node;
      while(topBlock && topBlock.parentNode !== editor) topBlock = topBlock.parentNode;
      if(!topBlock || topBlock.parentNode !== editor) return;
      if(!topBlock.classList.contains('md-li')) return;

      const probe = document.createRange();
      probe.selectNodeContents(topBlock);
      try { probe.setEnd(range.startContainer, range.startOffset); } catch(_){ return; }
      const beforeText = probe.toString().replace(/[\s\u00a0]/g, '');
      if(beforeText !== '') return;

      e.preventDefault();

      const level = parseInt(topBlock.dataset.indent || '0', 10) || 0;

      if(level > 0){
        topBlock.dataset.indent = String(level - 1);
        topBlock.style.marginLeft = ((level - 1) * 20) + 'px';
        updateDescFromEditor();
        return;
      }

      const isEmpty = !(topBlock.textContent || '').replace(/[\s\u00a0]/g, '');
      topBlock.classList.remove('md-li', 'md-ol');
      topBlock.removeAttribute('data-marker');
      topBlock.removeAttribute('data-indent');
      topBlock.style.marginLeft = '';
      if(isEmpty){
        topBlock.innerHTML = '<br>';
      }
      const newRange = document.createRange();
      newRange.selectNodeContents(topBlock);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      updateDescFromEditor();
      return;
    }

    if(e.key==='Enter' && !e.shiftKey){
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      let node = sel.anchorNode;
      if(node.nodeType===3) node = node.parentNode;

      const checkBlock = node.closest && node.closest('.md-check');
      if(checkBlock){
        e.preventDefault();
        const level = parseInt(checkBlock.dataset.indent || '0', 10) || 0;
        const nb = document.createElement('div');
        nb.className = 'md-check';
        nb.setAttribute('data-check','0');
        nb.setAttribute('data-indent', String(level));
        if(level > 0) nb.style.marginLeft = (level * 20) + 'px';
        nb.innerHTML = '<span class="md-chk" contenteditable="false">[ ]</span>&nbsp;';
        checkBlock.parentNode.insertBefore(nb, checkBlock.nextSibling);
        const range = document.createRange();
        range.selectNodeContents(nb);
        range.collapse(false);
        sel.removeAllRanges(); sel.addRange(range);
        updateDescFromEditor();
        return;
      }

      const liBlock = node.closest && node.closest('.md-li');
      if(liBlock){
        e.preventDefault();
        const level = parseInt(liBlock.dataset.indent || '0', 10) || 0;
        const curMarker = liBlock.dataset.marker || (liBlock.classList.contains('md-ol') ? '1.' : '-');
        const nextMarker = getNextMarker(curMarker);
        const isOrdered = /^[\dA-Za-z]+\.$/.test(nextMarker);
        const nb = document.createElement('div');
        nb.className = isOrdered ? 'md-li md-ol' : 'md-li';
        nb.setAttribute('data-indent', String(level));
        if(nextMarker !== '-') nb.setAttribute('data-marker', nextMarker);
        if(level > 0) nb.style.marginLeft = (level * 20) + 'px';
        nb.innerHTML = '<br>';
        liBlock.parentNode.insertBefore(nb, liBlock.nextSibling);
        const range = document.createRange();
        range.selectNodeContents(nb);
        range.collapse(true);
        sel.removeAllRanges(); sel.addRange(range);
        updateDescFromEditor();
        return;
      }

      let topBlock = node;
      while(topBlock && topBlock.parentNode !== editor) topBlock = topBlock.parentNode;
      if(topBlock && topBlock.parentNode === editor && topBlock.tagName === 'DIV'){
        const range = sel.getRangeAt(0);
        const fullText = topBlock.textContent || '';
        if(range.collapsed && fullText.trim()){
          const preRange = range.cloneRange();
          preRange.selectNodeContents(topBlock);
          try { preRange.setEnd(range.startContainer, range.startOffset); } catch(_){}
          if(preRange.toString().length === fullText.length){
            const m = fullText.match(/^(\s*)([-*+]|\d+\.|[a-zA-Z]+\.)(?:\s+(.*)|$)/);
            if(m){
              e.preventDefault();
              const level = parseInt(topBlock.dataset.indent || '0', 10) || 0;
              const marker = m[2];
              const content = m[3] || '';
              const isOrdered = /^[\dA-Za-z]+\.$/.test(marker);

              topBlock.className = isOrdered ? 'md-li md-ol' : 'md-li';
              topBlock.dataset.indent = String(level);
              if(isOrdered) topBlock.dataset.marker = marker;
              topBlock.style.marginLeft = level > 0 ? (level * 20) + 'px' : '';
              topBlock.innerHTML = content && content.trim() ? mdInline(content) : '<br>';

              const nextMarker = getNextMarker(marker);
              const nextIsOrdered = /^[\dA-Za-z]+\.$/.test(nextMarker);
              const nb = document.createElement('div');
              nb.className = nextIsOrdered ? 'md-li md-ol' : 'md-li';
              nb.setAttribute('data-indent', String(level));
              if(nextMarker !== '-') nb.setAttribute('data-marker', nextMarker);
              if(level > 0) nb.style.marginLeft = (level * 20) + 'px';
              nb.innerHTML = '<br>';
              topBlock.parentNode.insertBefore(nb, topBlock.nextSibling);

              const newRange = document.createRange();
              newRange.selectNodeContents(nb);
              newRange.collapse(true);
              sel.removeAllRanges();
              sel.addRange(newRange);
              updateDescFromEditor();
              return;
            }
          }
        }
      }
    }
  });

  editor.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    const urlRe = /https?:\/\/[^\s<>"']+/gi;
    let html = escapeHtml(text);
    html = html.replace(urlRe, (url) => '<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>');
    html = html.replace(/\n/g, '<br>');
    document.execCommand('insertHTML', false, html);
    updateDescFromEditor();
  });

  let draggedAttEl = null;
  editor.addEventListener('dragstart', e => {
    const att = e.target.closest('.md-att');
    if(!att) return;
    draggedAttEl = att;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', att.dataset.attId || ''); } catch(_){}
  });
  editor.addEventListener('dragend', () => {
    draggedAttEl = null;
    clearDragIndicators(editor);
  });
  editor.addEventListener('dragover', e => {
    if(!draggedAttEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    clearDragIndicators(editor);
    const target = getBlockAtPoint(editor, e.clientX, e.clientY);
    if(target && target !== draggedAttEl){
      const rect = target.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      target.classList.add(before ? 'drag-target-before' : 'drag-target-after');
    }
  });
  editor.addEventListener('dragleave', e => {
    if(!draggedAttEl) return;
    if(!editor.contains(e.relatedTarget)){
      clearDragIndicators(editor);
    }
  });
  editor.addEventListener('drop', e => {
    if(!draggedAttEl) return;
    e.preventDefault();
    clearDragIndicators(editor);
    let range = null;
    try {
      if(document.caretRangeFromPoint){
        range = document.caretRangeFromPoint(e.clientX, e.clientY);
      } else if(document.caretPositionFromPoint){
        const p = document.caretPositionFromPoint(e.clientX, e.clientY);
        if(p){
          range = document.createRange();
          range.setStart(p.offsetNode, p.offset);
          range.collapse(true);
        }
      }
    } catch(_){ range = null; }
    if(!range || !editor.contains(range.startContainer)){
      editor.appendChild(draggedAttEl);
      updateDescFromEditor();
      return;
    }
    let node = range.startContainer;
    if(node.nodeType === 3) node = node.parentNode;
    let block = node;
    while(block && block !== editor && block.parentNode !== editor) block = block.parentNode;
    if(block && block.parentNode === editor && block !== draggedAttEl){
      const rect = block.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      const target = before ? block : block.nextSibling;
      if(target !== draggedAttEl) editor.insertBefore(draggedAttEl, target);
    } else if(!block || block === editor){
      editor.appendChild(draggedAttEl);
    }
    updateDescFromEditor();
  });
}

function updateToolbarState(){

function blockIndent(delta){
  const editor = document.getElementById('modal-desc');
  if(!editor) return;

  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const savedRange = sel.getRangeAt(0).cloneRange();

  if(document.activeElement !== editor){
    editor.focus();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  const range = sel.getRangeAt(0);
  const blocks = [];

  if(range.collapsed){
    let node = range.startContainer;
    if(node && node.nodeType === 3) node = node.parentNode;
    let topBlock = null;
    if(node && editor.contains(node)){
      let cur = node;
      while(cur && cur.parentNode !== editor) cur = cur.parentNode;
      if(cur && cur.parentNode === editor && cur !== editor) topBlock = cur;
    }
    if(topBlock) blocks.push(topBlock);
  } else {
    const allBlocks = editor.querySelectorAll('.md-p, .md-li, .md-check, .md-h1, .md-h2, .md-h3');
    for(const block of allBlocks){
      if(range.intersectsNode(block)) blocks.push(block);
    }
  }

  for(const block of blocks){
    const cur = parseInt(block.dataset.indent || '0', 10) || 0;
    const next = Math.max(0, cur + delta);
    if(next === cur) continue;
    block.dataset.indent = String(next);
    block.style.marginLeft = (next * 20) + 'px';
  }
  updateDescFromEditor();
}

function toggleListType(type){
  const editor = document.getElementById('modal-desc');
  if(!editor) return;

  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const savedRange = sel.getRangeAt(0).cloneRange();

  if(document.activeElement !== editor){
    editor.focus();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  const range = sel.getRangeAt(0);
  const blocks = [];

  if(range.collapsed){
    let node = range.startContainer;
    if(node && node.nodeType === 3) node = node.parentNode;
    let topBlock = null;
    if(node && editor.contains(node)){
      let cur = node;
      while(cur && cur.parentNode !== editor) cur = cur.parentNode;
      if(cur && cur.parentNode === editor && cur !== editor) topBlock = cur;
    }
    if(topBlock) blocks.push(topBlock);
  } else {
    const allBlocks = editor.querySelectorAll('.md-p, .md-li, .md-check, .md-h1, .md-h2, .md-h3');
    for(const block of allBlocks){
      if(range.intersectsNode(block)) blocks.push(block);
    }
  }

  for(const block of blocks){
    const level = parseInt(block.dataset.indent || '0', 10) || 0;
    const hasLi = block.classList.contains('md-li');
    const isOl = hasLi && block.classList.contains('md-ol');
    const curMarker = block.dataset.marker || '';
    const isAlphaMarker = isOl && /^[a-zA-Z]+\.$/.test(curMarker);
    const isNumMarker = isOl && /^\d+\.$/.test(curMarker);
    const isBulletLi = hasLi && !isOl;

    let targetType = null;
    if(type === 'ul' && !isBulletLi) targetType = 'ul';
    else if(type === 'ol' && !(isOl && isNumMarker)) targetType = 'ol';
    else if(type === 'alpha' && !(isOl && isAlphaMarker)) targetType = 'alpha';

    if(targetType === null){
      block.classList.remove('md-li', 'md-ol');
      block.removeAttribute('data-marker');
      block.removeAttribute('data-indent');
      block.style.marginLeft = '';
      continue;
    }

    block.classList.add('md-li');
    if(level > 0) block.style.marginLeft = (level * 20) + 'px';
    else block.style.marginLeft = '';
    block.setAttribute('data-indent', String(level));

    if(targetType === 'ul'){
      block.classList.remove('md-ol');
      block.removeAttribute('data-marker');
    } else if(targetType === 'ol'){
      block.classList.add('md-ol');
      let nextNum = 1;
      const prev = findPrevListAtLevel(block, level);
      if(prev && prev.classList.contains('md-ol')){
        const prevMarker = prev.dataset.marker || '';
        if(/^\d+\.$/.test(prevMarker)) nextNum = parseInt(prevMarker, 10) + 1;
      }
      block.dataset.marker = nextNum + '.';
    } else if(targetType === 'alpha'){
      block.classList.add('md-ol');
      let nextLetter = 'a';
      const prev = findPrevListAtLevel(block, level);
      if(prev && prev.classList.contains('md-ol')){
        const prevMarker = prev.dataset.marker || '';
        if(/^[a-z]+\.$/.test(prevMarker)){
          nextLetter = incrementAlpha(prevMarker.slice(0, -1));
        }
      }
      block.dataset.marker = nextLetter + '.';
    }
  }

  updateDescFromEditor();
}

function findPrevListAtLevel(block, level){
  let prev = block.previousElementSibling;
  while(prev){
    if(prev.classList && prev.classList.contains('md-li')){
      const pLevel = parseInt(prev.dataset.indent || '0', 10) || 0;
      if(pLevel === level) return prev;
    } else if(prev.classList && (prev.classList.contains('md-p') || prev.classList.contains('md-h1') || prev.classList.contains('md-h2') || prev.classList.contains('md-h3'))){
      return null;
    }
    prev = prev.previousElementSibling;
  }
  return null;
}

function insertCheckboxBlock(){
  const editor = document.getElementById('modal-desc');
  if(!editor) return;
  editor.focus();

  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);

  let node = range.startContainer;
  if(node.nodeType === 3) node = node.parentNode;
  let block = null;
  if(node && editor.contains(node)){
    let cur = node;
    while(cur && cur.parentNode !== editor) cur = cur.parentNode;
    if(cur && cur.parentNode === editor && cur !== editor) block = cur;
  }

  const div = document.createElement('div');
  div.className = 'md-check';
  div.setAttribute('data-check', '0');
  div.setAttribute('data-indent', '0');
  div.innerHTML = '<span class="md-chk" contenteditable="false">[ ]</span>&nbsp;';

  if(block && block.parentNode === editor){
    const blockText = (block.textContent || '').replace(/\s/g, '');
    const isSpecial = block.classList.contains('md-check') || block.classList.contains('md-li') || block.classList.contains('md-pre') || /md-h[1-3]/.test(block.className);
    if(!blockText && !isSpecial){
      block.parentNode.replaceChild(div, block);
    } else {
      block.parentNode.insertBefore(div, block.nextSibling);
    }
  } else {
    editor.appendChild(div);
  }

  const newRange = document.createRange();
  newRange.selectNodeContents(div);
  newRange.collapse(false);
  sel.removeAllRanges();
  sel.addRange(newRange);

  updateToolbarState();
  updateDescFromEditor();
}

let toastTimer=null;
function toast(msg, action, opts){
  const el = document.getElementById('toast');
  if(!el) return;
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  if(opts && opts.danger) span.style.color = 'var(--red)';
  el.appendChild(span);
  if(action && action.onClick){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = action.label || 'undo';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.remove('show');
      if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
      try { action.onClick(); } catch(err){ console.error(err); }
    });
    el.appendChild(btn);
  }
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  const dur = (action && typeof action.duration === 'number') ? action.duration : (action ? 6000 : 2000);
  toastTimer = setTimeout(()=>el.classList.remove('show'), dur);
}

const openReminderIds = new Set();
let lastReminderSig = '';

function checkReminders(){
  const cur = nowStr();
  for(const t of state.tasks){
    if(t.done || t.reminderDone) continue;
    if(openReminderIds.has(t.id)) continue;
    let at = t.nextReminderAt;
    if(!at && t.dueDate) at = t.dueDate + 'T' + effectiveTime(t);
    if(!at) continue;
    if(at <= cur) openReminderIds.add(t.id);
  }
  const sig = [...openReminderIds].sort().join('|');
  if(sig !== lastReminderSig){
    lastReminderSig = sig;
    rebuildReminderModal();
  }
}

function rebuildReminderModal(){
  const ov = document.getElementById('reminder-overlay');
  const list = document.getElementById('reminder-list');
  list.innerHTML = '';
  const ids = [...openReminderIds];
  if(ids.length === 0){ ov.classList.remove('show'); return; }
  for(const id of ids){
    const t = state.tasks.find(x => x.id === id);
    if(!t) continue;
    const descLine = (t.description || '').split('\n').find(l => l.trim() && !l.trim().startsWith('@attach:')) || '';
    const card = document.createElement('div');
    card.className = 'rm-card';
    card.dataset.taskId = id;
    card.innerHTML =
      '<button class="card-x" data-action="dismiss" aria-label="dismiss">×</button>' +
      '<div class="rm-task-title">' + escapeHtml(t.title || '(untitled)') + '</div>' +
      (descLine ? '<div class="rm-task-desc">' + escapeHtml(descLine) + '</div>' : '') +
      '<div class="rm-actions">' +
        '<button data-action="done">done</button>' +
        '<button data-action="postpone">postpone</button>' +
      '</div>' +
      '<div class="rm-snooze" hidden>' +
        '<div class="rm-buttons">' +
          '<button data-snooze="15">+15m</button>' +
          '<button data-snooze="30">+30m</button>' +
          '<button data-snooze="60">+1h</button>' +
          '<button data-snooze="120">+2h</button>' +
          '<button data-snooze="300">+5h</button>' +
          '<button data-snooze="tomorrow">tomorrow</button>' +
          '<button data-snooze="nextmon">next mon</button>' +
        '</div>' +
      '</div>';
    list.appendChild(card);
  }
  ov.classList.add('show');
}

document.getElementById('reminder-overlay').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const card = e.target.closest('.rm-card');
  if(!card) return;

  if(btn.dataset.action === 'postpone'){
    const snooze = card.querySelector('.rm-snooze');
    const pb = card.querySelector('[data-action="postpone"]');
    if(snooze) snooze.hidden = false;
    if(pb) pb.hidden = true;
    return;
  }

  const id = card.dataset.taskId;
  const t = state.tasks.find(x => x.id === id);
  if(!t){ openReminderIds.delete(id); checkReminders(); return; }

  if(btn.dataset.action === 'done'){
    const prevDone = t.done;
    const prevCompletedAt = t.completedAt;
    const prevReminderDone = t.reminderDone;
    const prevNextReminderAt = t.nextReminderAt;
    t.done = true;
    t.completedAt = Date.now();
    t.reminderDone = true;
    t.nextReminderAt = null;
    scheduleSave();
    openReminderIds.delete(id);
    toast('done: ' + (t.title || 'task'), {
      label: 'undo',
      onClick: () => {
        const tt = state.tasks.find(x=>x.id===id);
        if(!tt) return;
        tt.done = prevDone;
        tt.completedAt = prevCompletedAt;
        tt.reminderDone = prevReminderDone;
        tt.nextReminderAt = prevNextReminderAt;
        scheduleSave(); render();
        checkReminders();
        toast('restored');
      }
    });
    render();
    checkReminders();
    return;
  }

  if(btn.dataset.action === 'dismiss'){
    t.reminderDone = true;
    t.nextReminderAt = null;
    scheduleSave();
    openReminderIds.delete(id);
    checkReminders();
    return;
  }

  const s = btn.dataset.snooze;
  if(!s) return;
  let target = null;
  if(s === 'tomorrow'){
    target = new Date();
    target.setDate(target.getDate() + 1);
    target.setHours(9,0,0,0);
  } else if(s === 'nextmon'){
    target = new Date();
    const dow = target.getDay();
    const add = ((1 - dow + 7) % 7) || 7;
    target.setDate(target.getDate() + add);
    target.setHours(9,0,0,0);
  } else {
    const mins = parseInt(s, 10);
    target = new Date(Date.now() + mins*60000);
  }
  const prevNext = t.nextReminderAt;
  const prevDone = t.reminderDone;
  t.nextReminderAt = localDateTimeStr(target);
  t.reminderDone = false;
  scheduleSave();
  openReminderIds.delete(id);
  toast('snoozed until ' + t.nextReminderAt.replace('T',' '), {
    label: 'undo',
    onClick: () => {
      const tt = state.tasks.find(x=>x.id===id);
      if(!tt) return;
      tt.nextReminderAt = prevNext;
      tt.reminderDone = prevDone;
      scheduleSave();
      checkReminders();
      toast('restored');
    }
  });
  checkReminders();
});

function showDragGhosts(){
  const mc = document.getElementById('main-content');
  if(!mc) return;
  const existing = new Set(Array.from(mc.querySelectorAll('.date-group:not(.ghost)')).map(g=>g.dataset.date));
  for(const b of DRAG_BUCKETS){
    const d = b.date();
    const key = d || 'no-date';
    if(existing.has(key)) continue;
    if(mc.querySelector('.date-group.ghost[data-date="'+key+'"]')) continue;
    const el = document.createElement('section');
    el.className = 'date-group ghost';
    el.dataset.date = key;
    el.innerHTML = '<header class="date-header">'+b.label+'</header><div class="tasks"></div>';
    mc.appendChild(el);
  }
}
function hideDragGhosts(){ document.querySelectorAll('.date-group.ghost').forEach(g=>g.remove()); }
function clearDropMarkers(){
  document.querySelectorAll('.task-row, .nested-item').forEach(r => {
    r.classList.remove('drop-nest', 'drop-reorder-before', 'drop-reorder-after');
  });
  document.querySelectorAll('.date-group').forEach(g=>g.classList.remove('drop-date'));
}
function findDropTarget(x, y){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  const targetEl = el.closest('.task-row[data-id], .nested-item[data-id]');
  if(targetEl && targetEl !== taskDrag.el && targetEl.dataset.id){
    const tid = targetEl.dataset.id;
    if(taskDrag.ids.includes(tid)) return null;
    for(const id of taskDrag.ids){
      if(isAncestorOf(id, tid)) return null;
    }
    if(taskDrag.ids.length === 1){
      const target = state.tasks.find(t => t.id === tid);
      const dragged = taskDrag.task;
      if(target && dragged){
        const sameParent = (target.parentId || null) === (dragged.parentId || null);
        let canReorderHere = false;
        if(sameParent){
          if(!dragged.parentId){
            canReorderHere = (target.dueDate === dragged.dueDate);
          } else {
            canReorderHere = true;
          }
        }
        if(canReorderHere){
          const rect = targetEl.getBoundingClientRect();
          const relY = y - rect.top;
          const edge = rect.height * 0.25;
          if(relY < edge) return { type:'reorder', targetId: tid, el: targetEl, before: true };
          if(relY > rect.height - edge) return { type:'reorder', targetId: tid, el: targetEl, before: false };
          return { type:'nest', targetId: tid, el: targetEl };
        }
      }
    }
    return { type:'nest', targetId: tid, el: targetEl };
  }
  const group = el.closest('.date-group');
  if(group) return { type:'date', date: group.dataset.date, el: group };
  return null;
}
function updateDropMarker(x, y){
  clearDropMarkers();
  const t = findDropTarget(x, y);
  taskDrag.dropTarget = t;
  if(t){
    if(t.type==='nest') t.el.classList.add('drop-nest');
    else if(t.type==='date') t.el.classList.add('drop-date');
    else if(t.type==='reorder') t.el.classList.add(t.before ? 'drop-reorder-before' : 'drop-reorder-after');
  }
}

function getDragScroller(){
  if(!taskDrag || !taskDrag.el) return null;
  const ns = taskDrag.el.closest('.nested-section');
  if(ns) return ns;
  const leftScroll = document.getElementById('left-scroll');
  if(leftScroll && leftScroll.contains(taskDrag.el)) return leftScroll;
  return null;
}
function dragAutoScrollTick(){
  if(!taskDrag || !taskDrag.moved){
    dragAutoScrollRAF = null;
    return;
  }
  const scroller = getDragScroller();
  if(scroller){
    const rect = scroller.getBoundingClientRect();
    const threshold = 60;
    const maxSpeed = 10;
    let delta = 0;
    if(lastPointerY < rect.top + threshold){
      const intensity = Math.min(1, (rect.top + threshold - lastPointerY) / threshold);
      delta = -maxSpeed * intensity;
    } else if(lastPointerY > rect.bottom - threshold){
      const intensity = Math.min(1, (lastPointerY - (rect.bottom - threshold)) / threshold);
      delta = maxSpeed * intensity;
    }
    if(delta !== 0){
      const maxScroll = scroller.scrollHeight - scroller.clientHeight;
      const next = Math.max(0, Math.min(maxScroll, scroller.scrollTop + delta));
      if(next !== scroller.scrollTop){
        scroller.scrollTop = next;
      }
    }
  }
  dragAutoScrollRAF = requestAnimationFrame(dragAutoScrollTick);
}
function startDragAutoScroll(){
  if(dragAutoScrollRAF) return;
  dragAutoScrollRAF = requestAnimationFrame(dragAutoScrollTick);
}
function stopDragAutoScroll(){
  if(dragAutoScrollRAF){
    cancelAnimationFrame(dragAutoScrollRAF);
    dragAutoScrollRAF = null;
  }
}

document.addEventListener('pointerdown', e => {
  if(e.button !== undefined && e.button !== 0) return;
  const handle = e.target.closest('.drag-handle');
  if(!handle || !handle.dataset.dragId) return;
  e.preventDefault();
  e.stopPropagation();
  const id = handle.dataset.dragId;
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  let ids = [id];
  if(state.selectedTaskIds.has(id) && state.selectedTaskIds.size > 1){
    ids = [...state.selectedTaskIds].filter(x => {
      let cur = state.tasks.find(t=>t.id===x);
      while(cur && cur.parentId){
        if(state.selectedTaskIds.has(cur.parentId)) return false;
        cur = state.tasks.find(t=>t.id===cur.parentId);
      }
      return true;
    });
    if(!ids.includes(id)) ids.push(id);
  }
  const container = handle.closest('.task-row, .nested-item');
  lastPointerY = e.clientY;
  taskDrag = {
    ids, id, el: container, task,
    pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    moved: false, dropTarget: null,
  };
}, true);

document.addEventListener('pointermove', e => {
  if(!taskDrag) return;
  if(taskDrag.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== taskDrag.pointerId) return;
  lastPointerY = e.clientY;
  const dx = e.clientX - taskDrag.startX, dy = e.clientY - taskDrag.startY;
  if(!taskDrag.moved){
    if(dx*dx + dy*dy < 36) return;
    taskDrag.moved = true;
    if(taskDrag.el) taskDrag.el.classList.add('dragging');
    document.body.classList.add('dragging');
    showDragGhosts();
    startDragAutoScroll();
  }
  if(!document.querySelector('.date-group.ghost')){
    showDragGhosts();
  }
  updateDropMarker(e.clientX, e.clientY);
  showDragPreview(e.clientX, e.clientY, taskDrag.task.title, taskDrag.ids.length);
});

document.addEventListener('pointerup', e => {
  if(!taskDrag) return;
  const moved = taskDrag.moved;
  if(moved && taskDrag.dropTarget){
    const d = taskDrag.dropTarget;
    if(d.type==='nest'){
      let nested = 0;
      const undoData = [];
      for(const id of taskDrag.ids){
        if(id === d.targetId) continue;
        const child = state.tasks.find(x=>x.id===id);
        if(!child) continue;
        const before = { id, parentId: child.parentId, dueDate: child.dueDate, dueTime: child.dueTime, dueTimeExplicit: child.dueTimeExplicit };
        if(nestTask(id, d.targetId)){
          nested++;
          undoData.push(before);
        }
      }
      if(nested) toast(nested === 1 ? 'subtask' : (nested + ' subtasks'), {
        label: 'undo',
        onClick: () => {
          for(const b of undoData){
            const c = state.tasks.find(x=>x.id===b.id);
            if(!c) continue;
            c.parentId = b.parentId;
            c.dueDate = b.dueDate;
            c.dueTime = b.dueTime;
            c.dueTimeExplicit = b.dueTimeExplicit;
            resetReminder(c);
          }
          scheduleSave(); render();
          toast('restored');
        }
      });
    } else if(d.type==='date'){
      const undoData = [];
      for(const id of taskDrag.ids){
        const c = state.tasks.find(x=>x.id===id);
        if(!c) continue;
        undoData.push({ id, parentId: c.parentId, dueDate: c.dueDate, dueTime: c.dueTime, dueTimeExplicit: c.dueTimeExplicit });
        unnestTask(id, d.date);
      }
      toast(taskDrag.ids.length === 1 ? 'moved' : ('moved ' + taskDrag.ids.length), {
        label: 'undo',
        onClick: () => {
          for(const b of undoData){
            const c = state.tasks.find(x=>x.id===b.id);
            if(!c) continue;
            c.parentId = b.parentId;
            c.dueDate = b.dueDate;
            c.dueTime = b.dueTime;
            c.dueTimeExplicit = b.dueTimeExplicit;
            resetReminder(c);
          }
          scheduleSave(); render();
          toast('restored');
        }
      });
    } else if(d.type==='reorder'){
      const dragged = state.tasks.find(t => t.id === taskDrag.id);
      let undoSnapshot = null;
      if(dragged){
        const info = getSiblingInfo(dragged);
        undoSnapshot = {
          sortKey: info.sortKey,
          orders: info.group.map(t => ({ t, order: t.order })),
          manualSort: state.manualSort[info.sortKey],
        };
      }
      reorderTask(taskDrag.id, d.targetId, d.before);
      toast(d.before ? 'moved up' : 'moved down', undoSnapshot ? {
        label: 'undo',
        onClick: () => {
          for(const o of undoSnapshot.orders) o.t.order = o.order;
          if(undoSnapshot.manualSort === undefined) delete state.manualSort[undoSnapshot.sortKey];
          else state.manualSort[undoSnapshot.sortKey] = undoSnapshot.manualSort;
          scheduleSave(); render();
          toast('restored');
        }
      } : undefined);
    }
    state.selectedTaskIds.clear();
    scheduleSave();
  }
  if(taskDrag.el) taskDrag.el.classList.remove('dragging');
  document.body.classList.remove('dragging');
  stopDragAutoScroll();
  clearDropMarkers();
  hideDragGhosts();
  hideDragPreview();
  if(moved){ suppressClickUntil = Date.now()+300; render(); }
  taskDrag = null;
});

document.addEventListener('pointercancel', () => {
  if(taskDrag){
    if(taskDrag.el) taskDrag.el.classList.remove('dragging');
    document.body.classList.remove('dragging');
    stopDragAutoScroll();
    clearDropMarkers();
    hideDragGhosts();
    hideDragPreview();
    taskDrag = null;
  }
});

const ctx = { el: null, open: false, items: [] };

function ensureCtxEl(){
  if(ctx.el) return ctx.el;
  const el = document.createElement('div');
  el.id = 'ctx-menu';
  document.body.appendChild(el);
  ctx.el = el;
  return el;
}

function hideCtx(){
  if(ctx.el) ctx.el.classList.remove('open');
  ctx.open = false;
  ctx.items = [];
}

function showCtxMenu(x, y, items){
  const el = ensureCtxEl();
  ctx.items = items;
  el.innerHTML = '';

  items.forEach((it, idx) => {
    if(it.sep){
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      el.appendChild(sep);
      return;
    }
    if(it.type === 'prio-chips'){
      const wrap = document.createElement('div');
      wrap.className = 'ctx-prio-chips';
      for(const p of [0,1,2,3]){
        const label = p===0?'—':'!'.repeat(p);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'prio-chip prio-'+p+(p === it.priority ? ' active' : '');
        btn.textContent = label;
        btn.addEventListener('pointerdown', ev => {
          ev.stopPropagation();
          ev.preventDefault();
          suppressClickUntil = Date.now() + 400;
          hideCtx();
          if(it.onChange){
            setTimeout(() => {
              try { it.onChange(p); } catch(err){ console.error(err); }
            }, 0);
          }
        }, true);
        wrap.appendChild(btn);
      }
      el.appendChild(wrap);
      return;
    }
    if(it.type === 'date-picker' || it.type === 'time-picker'){
      const wrap = document.createElement('div');
      wrap.className = 'ctx-date-row';
      const label = document.createElement('label');
      label.textContent = it.type === 'date-picker' ? 'date' : 'time';
      const input = document.createElement('input');
      input.type = it.type === 'date-picker' ? 'date' : 'time';
      input.value = it.value || '';
      input.addEventListener('pointerdown', ev => { ev.stopPropagation(); }, true);
      input.addEventListener('click', ev => { ev.stopPropagation(); }, true);
      input.addEventListener('change', () => {
        if(it.onChange) it.onChange(input.value || null);
        hideCtx();
      });
      wrap.appendChild(label);
      wrap.appendChild(input);
      el.appendChild(wrap);
      return;
    }
    const item = document.createElement('div');
    item.className = 'ctx-item' + (it.danger ? ' danger' : '');
    item.textContent = it.label;
    item.dataset.idx = String(idx);
    if(it.color) item.style.color = it.color;

    item.addEventListener('pointerdown', (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      suppressClickUntil = Date.now() + 400;
      const act = it.action;
      hideCtx();
      if(act){
        setTimeout(() => {
          try { act(); } catch(err){ console.error(err); toast('err: ' + (err && err.message || err)); }
        }, 0);
      }
    }, true);

    item.addEventListener('mousedown', (ev) => { ev.stopPropagation(); ev.preventDefault(); });
    item.addEventListener('click', (ev) => { ev.stopPropagation(); ev.preventDefault(); });

    el.appendChild(item);
  });

  el.classList.add('open');
  el.style.left = '-9999px';
  el.style.top = '-9999px';

  const r = el.getBoundingClientRect();
  let nx = x, ny = y;
  if(nx + r.width > innerWidth - 4) nx = Math.max(0, innerWidth - r.width - 4);
  if(ny + r.height > innerHeight - 4) ny = Math.max(0, innerHeight - r.height - 4);
  el.style.left = nx + 'px';
  el.style.top = ny + 'px';

  ctx.open = true;
}

function pointInMenu(x, y){
  if(!ctx.el || !ctx.open) return false;
  const r = ctx.el.getBoundingClientRect();
  return x >= r.left && x < r.right && y >= r.top && y < r.bottom;
}

function tryCloseOnEvent(e){
  if(!ctx.open) return false;
  const x = e.clientX, y = e.clientY;
  if(pointInMenu(x, y)) return false;
  if(e.target && e.target.closest && e.target.closest('#ctx-menu')) return false;
  hideCtx();
  suppressClickUntil = Date.now() + 300;
  return true;
}

document.addEventListener('pointerdown', tryCloseOnEvent, true);
document.addEventListener('mousedown', tryCloseOnEvent, true);
document.addEventListener('click', tryCloseOnEvent, true);
document.addEventListener('touchstart', (e) => {
  if(e.touches && e.touches[0]) tryCloseOnEvent({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, target: e.target });
}, true);
document.addEventListener('contextmenu', (e) => {
  if(!ctx.open) return;
  if(pointInMenu(e.clientX, e.clientY)) return;
  hideCtx();
}, true);

window.addEventListener('scroll', () => { if(ctx.open) hideCtx(); }, true);
window.addEventListener('resize', () => { if(ctx.open) hideCtx(); });
window.addEventListener('blur', () => { if(ctx.open) hideCtx(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && ctx.open) hideCtx(); });

function bulkSetPriority(tasks, p){
  for(const t of tasks) t.priority = p;
  scheduleSave(); render();
}
function bulkSetDate(tasks, date){
  for(const t of tasks){
    t.dueDate = date;
    if(date && !t.dueTime) t.dueTime = DEFAULT_TIME;
    if(!date){ t.dueTime = null; t.dueTimeExplicit = false; }
    resetReminder(t);
    propagateDate(t);
  }
  scheduleSave(); render();
}
function bulkSetTime(tasks, time){
  for(const t of tasks){
    t.dueTime = time;
    t.dueTimeExplicit = !!time;
    resetReminder(t);
  }
  scheduleSave(); render();
}

function setReminderDate(t, date){
  t.dueDate = date;
  if(date && !t.dueTime) t.dueTime = DEFAULT_TIME;
  if(!date){ t.dueTime = null; t.dueTimeExplicit = false; }
  resetReminder(t);
  propagateDate(t);
  scheduleSave();
  render();
}

function enterMultiSelect(id){
  state.multiMode = true;
  state.selectedTaskIds.add(id);
  render();
}

function handleCtx(kind, data, x, y){
  if(kind==='task'){
    const t = state.tasks.find(z=>z.id===data.id);
    if(!t) return;

    const bulk = state.selectedTaskIds.size > 1 && state.selectedTaskIds.has(t.id);
    if(bulk){
      const ids = [...state.selectedTaskIds];
      const tasks = ids.map(id => state.tasks.find(x=>x.id===id)).filter(Boolean);
      const n = tasks.length;
      showCtxMenu(x, y, [
        { label: 'prio: —',   action: ()=>bulkSetPriority(tasks, 0), color: 'var(--dim)' },
        { label: 'prio: !',   action: ()=>bulkSetPriority(tasks, 1), color: 'var(--cyan)' },
        { label: 'prio: !!',  action: ()=>bulkSetPriority(tasks, 2), color: 'var(--yellow)' },
        { label: 'prio: !!!', action: ()=>bulkSetPriority(tasks, 3), color: 'var(--red)' },
        { sep: true },
        { type: 'date-picker', value: '', onChange: (v)=>bulkSetDate(tasks, v || null) },
        { type: 'time-picker', value: '', onChange: (v)=>bulkSetTime(tasks, v || null) },
        { sep: true },
        { label: 'delete (' + n + ')', danger: true, action: ()=>deleteTasksBulk(ids) },
      ]);
      return;
    }

    const items = [];
    if(!state.selectedTaskIds.has(t.id)){
      items.push({ label: 'select (multi)', action: ()=>enterMultiSelect(t.id) });
      items.push({ sep: true });
    }

    items.push({ type: 'prio-chips', priority: t.priority, onChange: (p)=>{
      const tt = state.tasks.find(x=>x.id===t.id);
      if(!tt) return;
      tt.priority = p;
      scheduleSave(); render();
    }});

    items.push({ sep: true });
    items.push({ type: 'date-picker', value: t.dueDate || '', onChange: (v)=>{
      const tt = state.tasks.find(x=>x.id===t.id);
      if(!tt) return;
      setReminderDate(tt, v || null);
    }});
    items.push({ type: 'time-picker', value: t.dueTime || '', onChange: (v)=>{
      const tt = state.tasks.find(x=>x.id===t.id);
      if(!tt) return;
      tt.dueTime = v || null;
      tt.dueTimeExplicit = !!tt.dueTime;
      resetReminder(tt);
      scheduleSave(); render();
    }});
    if(t.parentId){
      items.push({ sep: true });
      items.push({ label: 'unnest', action: ()=>{ t.parentId=null; scheduleSave(); render(); } });
    }
    items.push({ sep: true });
    items.push({ label: 'create subtask', action: ()=>{
      const location = state.selectedTaskId === t.id ? 'editor' : 'list';
      startInlineNew(t.id, location);
    }});
    items.push({ label: 'duplicate', action: ()=>{
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = uid();
      copy.parentId = t.parentId;
      copy.title = t.title;
      copy.done = false; copy.completedAt = null; copy.createdAt = Date.now();
      copy.nextReminderAt = null; copy.reminderDone = false;
      copy.order = Date.now();
      copy.attachments = copy.attachments.map(a=>Object.assign({},a,{id:uid()}));
      addTask(copy);
      toast('duplicated', {
        label: 'open',
        duration: 10000,
        onClick: () => goToTask(copy.id)
      });
    }});
    items.push({ label: 'delete', danger: true, action: ()=>{ deleteTask(t.id); } });
    showCtxMenu(x, y, items);
  } else if(kind==='group'){
    const d = data.date;
    const ids = collectGroupTaskIds(d);
    showCtxMenu(x, y, [
      { label: 'select all (' + ids.length + ')', action: ()=>{
        state.multiMode = true;
        state.selectedTaskIds.clear();
        for(const id of ids) state.selectedTaskIds.add(id);
        render();
      }},
      { sep: true },
      { label: 'new task', action: ()=>{
        if(d !== 'done') state.forceNextDate = (d === 'no-date') ? null : d;
        document.getElementById('quick-input').focus();
      }},
    ]);
  } else if(kind==='main-empty'){
    showCtxMenu(x, y, [
      { label: 'new task', action: ()=>document.getElementById('quick-input').focus() },
    ]);
  }
}

function detectCtxTarget(e){
  const el = e.target.closest('[data-ctx]');
  if(el) return { kind: el.dataset.ctx, data: { id: el.dataset.ctxId || el.dataset.id } };
  const groupHeader = e.target.closest('.date-header');
  if(groupHeader){
    const group = groupHeader.closest('.date-group');
    if(group) return { kind: 'group', data: { date: group.dataset.date } };
  }
  if(e.target.closest('#left')) return { kind:'main-empty', data:{} };
  return null;
}

  const savedW = localStorage.getItem(LEFT_W_KEY);
  if(savedW) {
    const n = parseInt(savedW, 10);
    if(!isNaN(n) && n >= MIN_LEFT_W && n <= (innerWidth - MIN_RIGHT_W - DIVIDER_W)) {
      appEl.style.setProperty('--left-w', n + 'px');
    }
  }
} catch(_){}

dividerEl.addEventListener('pointerdown', e => {
  if(innerWidth <= 800) return;
  e.preventDefault();
  e.stopPropagation();
  dividerDrag = true;
  try { dividerEl.setPointerCapture(e.pointerId); } catch(_){}
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('pointermove', e => {
  if(!dividerDrag) return;
  const clamped = clampLeftWidth(e.clientX);
  appEl.style.setProperty('--left-w', clamped + 'px');
});
document.addEventListener('pointerup', e => {
  if(!dividerDrag) return;
  dividerDrag = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  try { localStorage.setItem(LEFT_W_KEY, appEl.style.getPropertyValue('--left-w') || ''); } catch(_){}
});

function formatToastDate(task){
  if(!task.dueDate) return 'no date';
  const [y,m,d] = task.dueDate.split('-');
  const base = d + '.' + m + '.' + y.slice(2);
  if(task.dueTimeExplicit && task.dueTime) return base + ' · ' + task.dueTime;
  return base;
}

function goToTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const dateKey = (typeof t.dueDate === 'string' && DATE_RE.test(t.dueDate)) ? t.dueDate : 'no-date';
  if(state.collapsed[dateKey]){
    delete state.collapsed[dateKey];
    renderList();
  }
  const el = document.querySelector('.task-row[data-id="'+id+'"]');
  if(el){
    try { el.scrollIntoView({behavior:'smooth', block:'center'}); } catch(_){ el.scrollIntoView(); }
    el.classList.add('blink');
    setTimeout(() => el.classList.remove('blink'), 1700);
  }
  openTask(id);
}

document.addEventListener('keydown', e => {
  if(!e.target || !e.target.classList) return;
  if(e.target.classList.contains('inline-new-input')){
    if(e.key === 'Enter'){ e.preventDefault(); commitInlineNew(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancelInlineNew(); }
  }
});
document.addEventListener('blur', e => {
  if(state._suppressBlur) return;
  if(!e.target || !e.target.classList) return;
  if(e.target.classList.contains('inline-new-input')){
    commitInlineNew(false);
  }
}, true);

function wireUI(){
  document.getElementById('main-content').addEventListener('click', e => {
    if(e.target.closest('a')) return;
    if(Date.now()<suppressClickUntil) return;

    const resetBtn = e.target.closest('[data-action="reset-sort"]');
    if(resetBtn){
      e.stopPropagation();
      const d = resetBtn.dataset.date;
      delete state.manualSort[d];
      scheduleSave();
      renderList();
      return;
    }

    const clearBtn = e.target.closest('[data-action="clear-done"]');
    if(clearBtn){
      e.stopPropagation();
      clearCompleted();
      return;
    }

    const collapseBtn = e.target.closest('[data-action="toggle-collapse"]');
    if(collapseBtn){
      e.stopPropagation();
      const d = collapseBtn.dataset.date;
      const isChevron = collapseBtn.classList.contains('dh-chevron');
      if(state.multiMode && !isChevron){
        const ids = collectGroupTaskIds(d);
        if(ids.length){
          const allSelected = ids.every(id => state.selectedTaskIds.has(id));
          if(allSelected){
            for(const id of ids) state.selectedTaskIds.delete(id);
          } else {
            for(const id of ids) state.selectedTaskIds.add(id);
          }
          renderList();
        }
        return;
      }
      if(d === 'done'){
        state.collapsed.done = state.collapsed.done === false;
      } else {
        if(state.collapsed[d]) delete state.collapsed[d];
        else state.collapsed[d] = true;
      }
      scheduleSave();
      renderList();
      return;
    }

    const row = e.target.closest('.task-row[data-id]');
    if(!row){
      if(!state.multiMode && state.selectedTaskIds.size > 0){
        state.selectedTaskIds.clear();
        renderList();
      }
      return;
    }

    const id = row.dataset.id;

    const toggle = e.target.closest('[data-action="toggle-task"]');
    if(toggle){ e.stopPropagation(); toggleTask(id); return; }
    if(e.target.closest('.drag-handle')) return;

    if(state.multiMode){
      if(state.selectedTaskIds.has(id)) state.selectedTaskIds.delete(id);
      else state.selectedTaskIds.add(id);
      renderList();
      return;
    }

    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      if(state.selectedTaskIds.has(id)) state.selectedTaskIds.delete(id);
      else state.selectedTaskIds.add(id);
      state.lastClickedTaskId = id;
      renderList();
      return;
    }

    if(e.shiftKey && state.lastClickedTaskId){
      e.preventDefault();
      const rows = [...document.querySelectorAll('.task-row[data-id]')];
      const ids = rows.map(r => r.dataset.id);
      const a = ids.indexOf(state.lastClickedTaskId);
      const b = ids.indexOf(id);
      if(a >= 0 && b >= 0){
        const [from, to] = a < b ? [a, b] : [b, a];
        for(let i=from; i<=to; i++) state.selectedTaskIds.add(ids[i]);
        renderList();
        return;
      }
    }

    if(state.selectedTaskIds.size > 0){
      state.selectedTaskIds.clear();
      renderList();
    }
    state.lastClickedTaskId = id;
    openTask(id);
  });

  document.getElementById('quick-add').addEventListener('click', e => {
    const btn = e.target.closest('[data-action="multi-done"]');
    if(btn){
      state.multiMode = false;
      state.selectedTaskIds.clear();
      renderList();
      return;
    }
  });

  const syncBtn = document.getElementById('sync-btn');
  if(syncBtn) syncBtn.addEventListener('click', syncSettingsDialog);

  const fabEl = document.getElementById('fab');
  if(fabEl){
    fabEl.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      if(state.multiMode){
        state.multiMode = false;
        state.selectedTaskIds.clear();
        renderList();
      }
      const scroll = document.getElementById('left-scroll');
      if(scroll) scroll.scrollTop = 0;
      const qi = document.getElementById('quick-input');
      if(qi){
        try { qi.focus(); } catch(_){}
        try {
          const len = qi.value.length;
          qi.selectionStart = qi.selectionEnd = len;
        } catch(_){}
      }
    });
  }

  document.getElementById('main-content').addEventListener('keydown', e => {
    const row = e.target.closest('.task-row[data-id]');
    if(!row || e.target !== row) return;
    if(e.key==='Enter'){
      e.preventDefault();
      const src = state.tasks.find(t=>t.id===row.dataset.id);
      if(!src) return;
      const nt = newTask({ dueDate: src.dueDate, dueTime: src.dueTime, dueTimeExplicit: src.dueTimeExplicit, parentId: src.parentId });
      state.tasks.push(nt);
      scheduleSave(); render(); openTask(nt.id);
    } else if(e.key===' '){ e.preventDefault(); toggleTask(row.dataset.id); }
    else if(e.key==='Delete'){ e.preventDefault(); deleteTask(row.dataset.id); }
  });

  const quick = document.getElementById('quick-input');
  quick.addEventListener('input', updateMirror);
  quick.addEventListener('scroll', updateMirror);
  quick.addEventListener('click', () => {
    const start = quick.selectionStart;
    const end = quick.selectionEnd;
    if(start !== end) return;
    const tok = getTokenAtPosition(quick.value, start);
    if(tok){
      qaRejectedTokens.add(tok);
      updateMirror();
    }
  });
  quick.addEventListener('blur', () => {
    state.forceNextDate = undefined;
  });
  quick.addEventListener('keydown', e => {
    if(e.key!=='Enter') return;
    const text = quick.value.trim();
    if(!text) return;
    const task = parseQuickAdd(text, qaRejectedTokens);
    if(!task.title && !task.description){ toast('empty'); return; }
    if(state.forceNextDate !== undefined){
      if(state.forceNextDate === null){
        task.dueDate = null;
        task.dueTime = null;
        task.dueTimeExplicit = false;
      } else {
        task.dueDate = state.forceNextDate;
      }
      state.forceNextDate = undefined;
    }
    quick.value='';
    qaRejectedTokens.clear();
    updateMirror();
    addTask(task);
    toast('added · ' + formatToastDate(task), {
      label: 'open',
      duration: 10000,
      onClick: () => goToTask(task.id)
    });
    if(task.dueDate && 'Notification' in window && Notification.permission==='default'){
      try { Notification.requestPermission(); } catch(_){}
    }
  });

  const panel = document.getElementById('right');

  let titleParseTimer = null;
  let titleRenderTimer = null;
  panel.addEventListener('input', e => {
    const t = state.selectedTaskId ? state.tasks.find(x=>x.id===state.selectedTaskId) : null;
    if(!t) return;
    const id = e.target.id;
    if(id==='modal-title'){
      const tid = t.id;
      t.title = e.target.value;
      scheduleSave();
      if(titleRenderTimer) clearTimeout(titleRenderTimer);
      titleRenderTimer = setTimeout(() => renderList(), 200);
      if(titleParseTimer) clearTimeout(titleParseTimer);
      titleParseTimer = setTimeout(() => {
        const tt = state.tasks.find(x=>x.id===tid);
        if(!tt) return;
        const nat = parseTitleNatural(tt.title);
        let changed = false;
        if(nat.dueDate !== undefined && nat.dueDate !== tt.dueDate){ tt.dueDate = nat.dueDate; changed = true; }
        if(nat.dueTime !== undefined && nat.dueTime !== tt.dueTime){
          tt.dueTime = nat.dueTime;
          tt.dueTimeExplicit = true;
          changed = true;
        }
        if(nat.cleanedTitle !== tt.title && (nat.dueDate !== undefined || nat.dueTime !== undefined)){
          tt.title = nat.cleanedTitle;
          changed = true;
        }
        if(changed){
          resetReminder(tt);
          const dEl = document.getElementById('modal-date');
          const tmEl = document.getElementById('modal-time');
          if(dEl) dEl.value = tt.dueDate || '';
          if(tmEl) tmEl.value = tt.dueTime || '';
          const ti = document.getElementById('modal-title');
          if(ti && ti.value !== tt.title){
            ti.value = tt.title;
            try { ti.selectionStart = ti.selectionEnd = ti.value.length; } catch(_){}
          }
          propagateDate(tt);
          syncEditorOverdue();
          scheduleSave(); renderList();
        }
      }, 500);
    }
    else if(id==='modal-date'){
      t.dueDate = e.target.value || null;
      if(t.dueDate && !t.dueTime){
        t.dueTime = DEFAULT_TIME;
        const tmEl = document.getElementById('modal-time');
        if(tmEl) tmEl.value = t.dueTime;
      }
      if(!t.dueDate){ t.dueTime = null; t.dueTimeExplicit = false; }
      resetReminder(t);
      propagateDate(t);
      syncEditorOverdue();
      scheduleSave(); renderList();
    }
    else if(id==='modal-time'){
      t.dueTime = e.target.value || null;
      t.dueTimeExplicit = !!t.dueTime;
      resetReminder(t);
      syncEditorOverdue();
      scheduleSave(); renderList();
    }
  });

  panel.addEventListener('click', e => {
    const toggle = e.target.closest('[data-action="toggle-task"]');
    if(toggle){ e.stopPropagation(); toggleTask(toggle.dataset.id); return; }

    if(e.target.closest('.drag-handle')) return;

    const nested = e.target.closest('.nested-item');
    if(nested && nested.dataset.id && !e.target.closest('[data-action]')){ openTask(nested.dataset.id); return; }

    const chip = e.target.closest('[data-prio]');
    if(chip){
      const t = state.selectedTaskId ? state.tasks.find(x=>x.id===state.selectedTaskId) : null;
      if(t){
        t.priority = parseInt(chip.dataset.prio, 10);
        const summary = panel.querySelector('.prio-dropdown > summary');
        if(summary){
          summary.className = 'prio-toggle prio-' + t.priority + ' active';
          summary.textContent = t.priority===0 ? '—' : '!'.repeat(t.priority);
        }
        panel.querySelectorAll('.prio-chip[data-prio]').forEach(c=>{
          c.classList.toggle('active', parseInt(c.dataset.prio,10)===t.priority);
        });
        const details = panel.querySelector('.prio-dropdown');
        if(details) details.removeAttribute('open');
        const chk = panel.querySelector('.editor-check');
        if(chk){
          chk.classList.remove('prio-high','prio-med','prio-low');
          if(t.priority===3) chk.classList.add('prio-high');
          else if(t.priority===2) chk.classList.add('prio-med');
          else if(t.priority===1) chk.classList.add('prio-low');
        }
        scheduleSave();
        renderList();
      }
      return;
    }
    const mdBtn = e.target.closest('[data-md]');
    if(mdBtn){
      const k = mdBtn.dataset.md;
      if(k==='b') applyFormat('bold');
      else if(k==='i') applyFormat('italic');
      else if(k==='ul') toggleListType('ul');
      else if(k==='ol') toggleListType('ol');
      else if(k==='alpha') toggleListType('alpha');
      else if(k==='check') insertCheckboxBlock();
      else if(k==='tab') blockIndent(1);
      else if(k==='untab') blockIndent(-1);
      else if(k==='undo'){
        const ed = document.getElementById('modal-desc');
        if(ed) ed.focus();
        try { document.execCommand('undo'); } catch(_){}
        updateDescFromEditor();
        updateToolbarState();
        return;
      }
      else if(k==='saveas'){ saveDescriptionAs(); return; }
      else if(k==='attach'){ attachFiles(); return; }
      try { mdBtn.blur(); } catch(_){}
      return;
    }
    const action = e.target.closest('[data-action]');
    if(!action) return;
    const a = action.dataset.action;
    const t = state.selectedTaskId ? state.tasks.find(x=>x.id===state.selectedTaskId) : null;

    if(a==='open-menu' && t){
      const r = action.getBoundingClientRect();
      handleEditorMenu(r.left, r.bottom + 4, t);
      return;
    }
    if(a==='add-nested' && t){
      startInlineNew(t.id, 'editor');
      return;
    }
    if(a==='open-att'){ openAttachment(action.dataset.id); return; }
    if(a==='explain-att'){
      toast('file unavailable: content is not synced across devices', null, {danger:true});
      return;
    }
    if(a==='open-img'){
      if(t){
        const att = t.attachments.find(x=>x.id===action.dataset.id);
        if(att && att.data) showImageFullscreen(att.data);
      }
      return;
    }
    if(a==='del-att'){ deleteAttachment(action.dataset.id); return; }
    if(a==='clear-date-time' && t){
      t.dueDate = null; t.dueTime = null; t.dueTimeExplicit = false;
      resetReminder(t);
      propagateDate(t);
      const dEl = document.getElementById('modal-date');
      const tmEl = document.getElementById('modal-time');
      if(dEl) dEl.value = '';
      if(tmEl) tmEl.value = '';
      syncEditorOverdue();
      scheduleSave(); renderList();
      return;
    }
    if(a==='close-modal'){ closeEditor(); return; }
  });

  panel.addEventListener('keydown', e => {
    if(e.key==='Escape'){ e.preventDefault(); closeEditor(); }
  });

  document.addEventListener('keydown', e => {
    if(e.key==='Escape' && openReminderIds.size > 0){
      e.preventDefault();
      return;
    }
    const inField = e.target.matches('input, textarea, select') || e.target.isContentEditable;
    if(e.key==='Escape' && !inField){
      if(state.selectedTaskId){ closeEditor(); return; }
      if(ctx.open){ hideCtx(); return; }
      if(state.multiMode){ state.multiMode=false; state.selectedTaskIds.clear(); renderList(); return; }
      if(state.selectedTaskIds.size > 0){ state.selectedTaskIds.clear(); renderList(); return; }
    }
    if(inField) return;
    if((e.key==='n'||e.key==='N') && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      document.getElementById('left-scroll').scrollTop = 0;
      quick.focus();
    }
  });

  window.addEventListener('beforeunload', () => {
    if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
    try {
      const v = JSON.stringify({ tasks: state.tasks, updatedAt: Date.now(), manualSort: state.manualSort, collapsed: state.collapsed });
      if(Storage.driver==='local') localStorage.setItem(STORAGE_KEY, v);
      else if(Storage.driver==='session') sessionStorage.setItem(STORAGE_KEY, v);
    } catch(_){}
  });

  try { document.execCommand('styleWithCSS', false, false); } catch(_){}
}

(async function boot(){
  try { await Storage.init(); } catch(_){ Storage.driver='memory'; Storage.ready=true; }
  try { await load(); } catch(_){}
  wireUI();
  render();
  updateSyncIcon();
  setInterval(checkReminders, 15000);
  setInterval(cloudPull, 3000);
  checkReminders();
  let lastDay = todayStr();
  setInterval(()=>{ const d=todayStr(); if(d!==lastDay){ lastDay=d; render(); } }, 60000);
})();

})();
</script>
</body>
</html>
