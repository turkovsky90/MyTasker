<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000">
<title>tasks</title>
<style>
:root{
  --bg:#000; --fg:#c8c8c8; --dim:#555; --dimmer:#333; --border:#2a2a2a;
  --cyan:#79c0ff; --yellow:#e3b341; --red:#ff7b72;
  --purple:#d2a8ff; --orange:#ffa657;
  --fs:15px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  font-size:var(--fs);line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
input,textarea,select,button{font:inherit;color:inherit;font-size:1em}
button{background:transparent;border:1px solid var(--border);color:var(--fg);
  padding:5px 12px;min-height:32px;line-height:1.2;cursor:pointer;
  outline:none;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--fg)}
button:focus,button:focus-visible,button:active{outline:none;box-shadow:none}
button::-moz-focus-inner{border:0;padding:0}
body.dragging{cursor:grabbing;user-select:none}

#app{display:grid;
  grid-template-columns: minmax(280px, var(--left-w, 1fr)) 4px minmax(400px, 1fr);
  height:100vh;height:100dvh}
#divider{background:var(--border);cursor:col-resize;position:relative;
  z-index:10;transition:background .15s;touch-action:none}
#divider:hover{background:rgba(121,192,255,.35)}
#left{display:grid;grid-template-rows:auto 1fr;border-right:1px solid var(--border);
  min-width:0;overflow:hidden}
#left-scroll{overflow-y:auto;padding:18px 12px 10px;min-height:0}
#right{display:flex;flex-direction:column;overflow-y:auto;padding:12px 16px;
  min-width:0;height:100%}
#right>*{flex-shrink:0}

@media (max-width:800px){
  #app{grid-template-columns:1fr}
  #divider{display:none}
  #right{display:none;position:fixed;inset:0;background:var(--bg);
    z-index:100;height:auto}
  #right.open{display:flex}
}

#quick-add{display:flex;gap:8px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--border);
  background:var(--bg);flex-shrink:0;transition:border-color .15s}
#quick-add:focus-within{border-bottom-color:var(--cyan)}
@media (max-width:800px){
  #quick-add{padding-top:calc(10px + env(safe-area-inset-top,0px));}
}
#qa-normal{display:flex;gap:8px;align-items:center;width:100%}
#qa-normal .hint{color:var(--cyan)}
#qa-normal input{flex:1;background:transparent;border:none;outline:none;
  color:var(--fg);padding:4px 0;font:inherit}
#qa-normal input::placeholder{color:var(--dimmer);opacity:1}
#qa-normal .qa-input-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
#qa-normal .qa-input-wrap input{display:block;width:100%;
  color:transparent;-webkit-text-fill-color:transparent;
  caret-color:var(--fg);background:transparent}
#qa-normal .qa-input-wrap input::placeholder{color:var(--dimmer);opacity:1;
  -webkit-text-fill-color:var(--dimmer)}
#qa-mirror{position:absolute;inset:0;padding:4px 0;pointer-events:none;
  color:var(--fg);white-space:pre;overflow:visible;font:inherit;
  will-change:transform}
#qa-mirror .hl{color:var(--cyan)}
#qa-multi{display:flex;gap:8px;align-items:center;width:100%;min-height:31px}
#qa-multi .qa-count-text{color:var(--cyan);flex:1;white-space:nowrap}
#qa-multi button{color:var(--cyan);border-color:rgba(121,192,255,.4);
  padding:2px 12px;min-height:26px;margin-left:auto}
#qa-multi button:hover{background:rgba(121,192,255,.15);border-color:var(--cyan)}

#sync-btn{
  background:transparent;border:none;
  color:var(--dim);
  padding:0 4px;
  min-height:0;min-width:22px;
  cursor:pointer;
  flex-shrink:0;
  line-height:1;
  font-family:inherit;font-size:1em;
  text-align:center;
}
#sync-btn:hover{color:var(--fg);border:none;background:transparent}

#fab{display:none}
@media (max-width:800px){
  #fab{
    display:flex;align-items:center;justify-content:center;
    position:fixed;bottom:54px;right:20px;width:44px;height:44px;
    background:var(--bg);color:var(--cyan);border:1px solid var(--border);
    font:inherit;font-size:1.2em;line-height:1;cursor:pointer;z-index:50;
    box-shadow:2px 2px 0 var(--border);
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  #fab:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--border)}
}

.date-group{margin-bottom:18px}
.date-group + .date-group:not(.ghost){
  border-top:1px solid var(--border);
  margin-inline:-12px;
  padding-inline:12px;
  padding-top:18px;
}
.date-header{color:var(--fg);padding:4px 0;
  margin-bottom:16px;
  display:flex;align-items:center}
.date-header .count{color:var(--dim)}
.dh-chevron{
  display:inline-block;width:1.2em;text-align:center;
  color:var(--fg);cursor:pointer;user-select:none;
  margin-right:6px;flex-shrink:0;line-height:1;
  font-size:1.15em;font-weight:bold;
}
.dh-chevron:hover{color:var(--cyan)}
.dh-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;user-select:none}
.dh-text:hover{opacity:.85}
.dh-text.dh-today{color:var(--cyan)}
.dh-text.dh-past{color:var(--red)}
.dh-text.dh-future{color:var(--fg)}
.dh-reset{
  background:transparent;border:none;color:var(--dimmer);
  padding:2px 4px;min-height:20px;font-size:1em;cursor:pointer;
  margin-left:auto;line-height:1;flex-shrink:0;
}
.dh-reset:hover{color:var(--dim)}

.date-group.done-group .date-header,
.date-group.done-group .dh-chevron,
.date-group.done-group .dh-text{color:var(--dim)}
.dh-trash{
  background:transparent;border:none;color:var(--dimmer);
  padding:2px 8px;min-height:20px;font-size:1em;cursor:pointer;
  margin-left:auto;line-height:1;flex-shrink:0;
}
.dh-trash:hover{color:var(--red)}

.dh-text,
.dh-text.dh-today,
.dh-text.dh-future{color:var(--cyan)}

.date-group.ghost{border:1px dashed var(--dimmer);padding:6px;opacity:.7;margin-bottom:12px}
.date-group.ghost .date-header{color:var(--dim)}
.date-group.drop-date{outline:1px dashed var(--cyan);background:#0a1520}
.date-group.ghost.drop-date{opacity:1}
.tasks{display:flex;flex-direction:column;gap:2px}

.task-row{display:grid;grid-template-columns:16px auto minmax(0,1fr);gap:4px;
  padding:6px 8px;cursor:pointer;align-items:start;user-select:none;outline:none}
.task-row.has-nest{grid-template-columns:16px auto auto minmax(0,1fr)}

.task-row:hover{background:#111}
.task-row.selected{background:#1a1a1a}
.task-row:focus{background:#181818}
.task-row.multisel{box-shadow:inset 3px 0 0 var(--cyan);background:#0a1520}
.task-row.multisel:hover{background:#0d1c2a}
.task-row.done .task-title{text-decoration:line-through;color:var(--dim)}
.task-row.overdue .task-title{color:var(--red)}
.task-row.overdue .task-meta .time{color:var(--red)}
.task-row.dragging{opacity:.3}
.task-row.drop-nest{outline:1px solid var(--cyan);background:#0a1520}
.task-row.drop-reorder-before{box-shadow:inset 0 2px 0 var(--cyan)}
.task-row.drop-reorder-after{box-shadow:inset 0 -2px 0 var(--cyan)}

@keyframes blinkAnim {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(121,192,255,.25); }
}
.task-row.blink{animation:blinkAnim 0.5s ease-in-out 3}

.drag-handle{color:var(--dim);cursor:grab;user-select:none;
  text-align:center;touch-action:none;line-height:1.4;padding-top:1px}
.task-row:hover .drag-handle{color:var(--fg)}
.drag-handle:hover{color:var(--fg)}
.drag-handle:active{cursor:grabbing}

.nest-col{color:var(--dim);user-select:none;text-align:center;
  line-height:1.4;padding:0 1px;white-space:nowrap}

.check{color:var(--dim);user-select:none;text-align:center;
  white-space:nowrap;line-height:1.4;padding:0 2px}
.task-row.prio-high .check{color:var(--red)}
.task-row.prio-med .check{color:var(--yellow)}
.task-row.prio-low .check{color:var(--cyan)}
.task-row.done .check{color:var(--dim)}

.task-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;min-width:0}
.task-title{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden}
.task-meta .prio{font-weight:normal}
.prio-high .task-meta .prio{color:var(--red)}
.prio-med .task-meta .prio{color:var(--yellow)}
.prio-low .task-meta .prio{color:var(--cyan)}
.task-meta .att{color:var(--dim)}
.task-meta .att-unavail{color:var(--red)}
.task-meta .sep{color:var(--dimmer);margin:0 6px}
.task-desc{grid-column:1/-1;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.task-desc a{color:var(--cyan);text-decoration:none}
.task-desc code{background:#111;color:var(--yellow);padding:0 2px}
.empty{color:var(--dim);padding:20px;text-align:center}
#right .empty-editor{flex:1 1 auto;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}

.inline-new-row{
  display:grid;grid-template-columns:16px auto auto minmax(0,1fr);gap:4px;
  padding:6px 8px;align-items:start;
}
.inline-new-input{
  background:transparent;border:none;border-bottom:1px solid var(--dimmer);
  color:var(--fg);padding:2px 0;outline:none;width:100%;min-width:0;
  font:inherit;min-height:22px;box-sizing:border-box;border-radius:0;
}
.inline-new-input:focus{border-bottom-color:var(--cyan)}
.nested-item .inline-new-input{margin-left:2px}

.editor-topbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.editor-check{
  background:transparent;border:none;
  color:var(--dim);
  cursor:pointer;
  font-size:1em;line-height:1.2;
  min-height:0;padding:4px 8px;flex-shrink:0;
  font-family:inherit;
}
.editor-check:hover{color:var(--fg)}
.editor-check.prio-high{color:var(--red)}
.editor-check.prio-med{color:var(--yellow)}
.editor-check.prio-low{color:var(--cyan)}
.editor-check.done{color:var(--dim)}
#modal-title{flex:1;min-width:0;background:transparent;border:none;
  border-bottom:1px solid var(--dimmer);color:#fff;
  font-size:1em;font-weight:normal;padding:6px 0;outline:none}
#modal-title:focus{border-color:var(--cyan)}
#modal-title.overdue{color:var(--red);border-bottom-color:var(--red)}
.editor-menu,.editor-x{
  width:40px;height:40px;min-height:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);line-height:1;flex-shrink:0;cursor:pointer;
  background:transparent;border:none;
}
.editor-menu{font-size:1.6em}
.editor-x{font-size:1.6em}
.editor-menu:hover,.editor-x:hover{color:var(--fg);border:none}

.desc-header{display:flex;align-items:center;gap:8px;color:var(--dim);
  flex-wrap:wrap;margin-top:12px;flex-shrink:0}
.md-toolbar{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto}
.md-btn{padding:4px 10px;min-height:32px;min-width:32px;text-align:center}
.md-btn:not(.active):hover{border-color:var(--fg);color:var(--fg)}
.md-btn.active{
  color:var(--cyan);
  border-color:rgba(121,192,255,.55);
  background:rgba(121,192,255,.25);
}

.desc-wrap{border-bottom:1px solid var(--dimmer);margin-top:4px;
  flex:1 1 0;min-height:120px;overflow-y:auto}
.desc-wrap:focus-within{border-color:var(--cyan)}
#modal-desc{outline:none;padding:4px 2px;color:var(--fg);
  min-height:100%;line-height:1.5;word-break:break-word}
#modal-desc .md-h1,#modal-desc .md-h2,#modal-desc .md-h3{
  color:var(--cyan);font-weight:normal;margin:4px 0;font-size:1em}
#modal-desc .md-p{margin:2px 0}
#modal-desc .md-li{margin:2px 0;padding-left:1.6em;position:relative;min-height:1.5em}
#modal-desc .md-li::before{content:'• ';color:var(--dim);position:absolute;left:0}
#modal-desc .md-li.md-ol::before{content:attr(data-marker) ' ';color:var(--dim)}
#modal-desc .md-check{margin:2px 0;padding-left:0;min-height:1.5em}
#modal-desc .md-check .md-chk{cursor:pointer;user-select:none;color:var(--dim);
  margin-right:4px}
#modal-desc .md-check.done{color:var(--dim);text-decoration:line-through}
#modal-desc .md-check.done .md-chk{color:var(--cyan)}
#modal-desc .md-pre{background:#0a0a0a;padding:4px 8px;
  border:1px solid var(--border);white-space:pre-wrap;margin:4px 0}
#modal-desc code{background:#111;padding:0 3px;color:var(--yellow)}
#modal-desc a{color:var(--cyan);text-decoration:underline}
#modal-desc hr.md-hr{border:none;border-top:1px solid var(--dim);margin:8px 0}

#modal-desc .md-att{
  display:flex;align-items:center;gap:8px;
  padding:4px 8px;margin:4px 0;
  border:1px solid var(--border);background:#0a0a0a;
  user-select:none;cursor:grab;outline:none;
}
#modal-desc .md-att:active{cursor:grabbing}
#modal-desc .md-att .md-att-handle{
  color:var(--dim);cursor:grab;user-select:none;
  padding:0 4px;flex-shrink:0;line-height:1;
  font-family:inherit;
}
#modal-desc .md-att:hover .md-att-handle{color:var(--fg)}
#modal-desc .md-att .md-att-handle:active{cursor:grabbing}
#modal-desc .md-att .md-att-thumb{
  max-width:60px;max-height:40px;object-fit:cover;
  border:1px solid var(--border);cursor:zoom-in;flex-shrink:0;
}
#modal-desc .md-att .md-att-icon{color:var(--cyan);min-width:42px;flex-shrink:0}
#modal-desc .md-att .md-att-name{flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal-desc .md-att .md-att-size{color:var(--dim);flex-shrink:0}
#modal-desc .md-att .md-att-open{color:var(--cyan);cursor:pointer;padding:0 6px;flex-shrink:0}
#modal-desc .md-att .md-att-open:hover{text-decoration:underline}
#modal-desc .md-att .md-att-unavailable{color:var(--red);cursor:pointer;padding:0 6px;flex-shrink:0}
#modal-desc .md-att .md-att-unavailable:hover{text-decoration:underline}
#modal-desc .md-att .md-att-del{color:var(--dim);cursor:pointer;padding:0 6px;flex-shrink:0}
#modal-desc .md-att .md-att-del:hover{color:var(--red)}
#modal-desc .md-att .md-att-placeholder{color:var(--dim)}

#modal-desc .drag-target-before{box-shadow:inset 0 2px 0 var(--cyan)}
#modal-desc .drag-target-after{box-shadow:inset 0 -2px 0 var(--cyan)}

.nested-section{display:flex;flex-direction:column;gap:2px;
  max-height:20vh;overflow-y:auto;flex-shrink:0;margin-top:0}
.nested-item{display:flex;gap:8px;align-items:baseline;padding:4px 8px;
  cursor:pointer;user-select:none}
.nested-item:hover{background:#111}
.nested-item.done .nested-title{text-decoration:line-through;color:var(--dim)}
.nested-item.overdue .nested-title{color:var(--red)}
.nested-item .nested-check{color:var(--dim);flex-shrink:0;cursor:pointer}
.nested-item.prio-high .nested-check{color:var(--red)}
.nested-item.prio-med .nested-check{color:var(--yellow)}
.nested-item.prio-low .nested-check{color:var(--cyan)}
.nested-item.done .nested-check{color:var(--dim)}
.nested-item .nested-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nested-item .nested-marker{color:var(--dim);flex-shrink:0}
.nested-item .drag-handle{padding-top:0;flex-shrink:0}
.nested-item:hover .drag-handle{color:var(--fg)}
.nested-item.dragging{opacity:.3}
.nested-item.drop-nest{outline:1px solid var(--cyan);background:#0a1520}
.nested-item.drop-reorder-before{box-shadow:inset 0 2px 0 var(--cyan)}
.nested-item.drop-reorder-after{box-shadow:inset 0 -2px 0 var(--cyan)}

.meta-row{display:flex;flex-direction:column;gap:10px;
  margin-top:12px;flex-shrink:0;position:relative}
.compact-row{display:flex;align-items:center;gap:8px;width:100%;flex-wrap:nowrap}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;
  gap:12px;width:100%}
.ctrl-label{color:var(--dim);flex-shrink:0}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input{background:transparent;border:none;
  border-bottom:1px solid var(--dimmer);color:var(--fg);
  padding:4px 0;outline:none;min-height:28px}
.field input:focus{border-color:var(--cyan)}
.field input.overdue{color:var(--red);border-bottom-color:var(--red)}
.field input.is-done{color:var(--dim);border-bottom-color:var(--dimmer)}

.compact-row .field{flex:0 0 auto}
.compact-row .field input[type="date"],
.compact-row .field input[type="time"]{
  -webkit-appearance:none;
  appearance:none;
  padding:4px 2px;
  min-height:28px;
  border-radius:0;
}
.compact-row .field input[type="date"]{width:126px}
.compact-row .field input[type="time"]{width:82px}
.compact-row .field input[type="date"]::-webkit-inner-spin-button,
.compact-row .field input[type="time"]::-webkit-inner-spin-button{
  display:none;
}
.compact-row .btn,
.compact-row .btn-clear,
.compact-row .prio-dropdown > summary{
  height:32px;
  min-height:32px;
  box-sizing:border-box;
}
.compact-row > .field:first-of-type{margin-left:auto}

.btn-subtask{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 8px;
}
.btn-subtask .subtask-icon{font-size:1.15em;line-height:1}
@media (max-width:800px){
  .btn-subtask{gap:0;padding:5px 14px;min-width:44px}
  .btn-subtask .subtask-label{display:none}
}

.prio-inline{
  display:flex;gap:4px;flex-shrink:0;margin-left:8px;
}
.prio-inline .prio-chip{
  width:52px;min-width:52px;
  padding:5px 0;
  min-height:32px;
  text-align:center;
  border-color:currentColor;
  font-weight:normal;
  background:transparent;
  cursor:pointer;
  font:inherit;
}
.prio-inline .prio-chip.prio-0{color:#777}
.prio-inline .prio-chip.prio-1{color:#3d6a8c}
.prio-inline .prio-chip.prio-2{color:#8f7a2e}
.prio-inline .prio-chip.prio-3{color:#a04a45}
.prio-inline .prio-chip:hover{filter:brightness(1.3)}
.prio-inline .prio-chip.active.prio-0{color:#d0d0d0;background:rgba(200,200,200,.24);border-color:#fff}
.prio-inline .prio-chip.active.prio-1{color:var(--cyan);background:rgba(121,192,255,.32);border-color:rgba(121,192,255,.6)}
.prio-inline .prio-chip.active.prio-2{color:var(--yellow);background:rgba(227,179,65,.32);border-color:rgba(227,179,65,.6)}
.prio-inline .prio-chip.active.prio-3{color:var(--red);background:rgba(255,123,114,.32);border-color:rgba(255,123,114,.6)}

.prio-dropdown{display:none;position:relative;flex-shrink:0}
.prio-dropdown > summary{
  list-style:none;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid currentColor;
  padding:0;
  width:52px;min-width:52px;
  line-height:1;
  font:inherit;
  background:transparent;
  color:#777;
  user-select:none;cursor:pointer;
}
.prio-dropdown > summary::-webkit-details-marker{display:none}
.prio-dropdown > summary.prio-0{color:#777}
.prio-dropdown > summary.prio-1{color:#3d6a8c}
.prio-dropdown > summary.prio-2{color:#8f7a2e}
.prio-dropdown > summary.prio-3{color:#a04a45}
.prio-dropdown > summary.prio-0.active{color:#d0d0d0;background:rgba(200,200,200,.24);border-color:#fff}
.prio-dropdown > summary.prio-1.active{color:var(--cyan);background:rgba(121,192,255,.32);border-color:rgba(121,192,255,.6)}
.prio-dropdown > summary.prio-2.active{color:var(--yellow);background:rgba(227,179,65,.32);border-color:rgba(227,179,65,.6)}
.prio-dropdown > summary.prio-3.active{color:var(--red);background:rgba(255,123,114,.32);border-color:rgba(255,123,114,.6)}
.prio-menu{
  position:absolute;
  bottom:calc(100% + 4px);
  right:0;
  display:flex;
  gap:4px;
  padding:6px;
  background:#0a0a0a;
  border:1px solid var(--border);
  z-index:100;
  white-space:nowrap;
}
.prio-menu .prio-chip{
  width:52px;min-width:52px;
  padding:5px 0;
  min-height:32px;
  text-align:center;
  border-color:currentColor;
  font-weight:normal;
  background:transparent;
  cursor:pointer;

<script>
(function(){
'use strict';

const STORAGE_KEY = 'tasks_v36';
const LEFT_W_KEY = 'tasks_v36_leftw';
const SYNC_CFG_KEY = 'sync_cfg_v36';
const DEFAULT_TIME = '09:00';

const MIN_LEFT_W  = 280;
const MIN_RIGHT_W = 400;
const DIVIDER_W   = 4;

const syncCfg = { binId:'', masterKey:'' };
let syncStatus = 'unset';

function jsonbinUrl(){ return 'https://api.jsonbin.io/v3/b/' + syncCfg.binId; }
function jsonbinHeaders(){
  return {
    'X-Master-Key': syncCfg.masterKey,
    'X-Bin-Meta': 'false',
    'Content-Type': 'application/json'
  };
}
function hasSyncCreds(){ return !!(syncCfg.binId && syncCfg.masterKey); }
function setSyncStatus(s){
  if(syncStatus === s) return;
  syncStatus = s;
  updateSyncIcon();
}
function updateSyncIcon(){
  const btn = document.getElementById('sync-btn');
  if(!btn) return;
  if(syncStatus === 'ok'){
    btn.textContent = ':)';
    btn.title = 'cloud sync: connected';
  } else if(syncStatus === 'error'){
    btn.textContent = ':(';
    btn.title = 'cloud sync: error — click to configure';
  } else {
    btn.textContent = ':|';
    btn.title = 'cloud sync: not configured — click to set up';
  }
}

let cloudUpdatedAt = 0;
let localDirty = false;
let syncBusy = false;

async function cloudPut(payload){
  if(!hasSyncCreds()) return false;
  try {
    const resp = await fetch(jsonbinUrl(), {
      method: 'PUT',
      headers: jsonbinHeaders(),
      body: JSON.stringify(payload)
    });
    setSyncStatus(resp.ok ? 'ok' : 'error');
    return resp.ok;
  } catch(_){
    setSyncStatus('error');
    return false;
  }
}

async function cloudGet(){
  if(!hasSyncCreds()) return null;
  try {
    const resp = await fetch(jsonbinUrl() + '/latest', {
      headers: jsonbinHeaders()
    });
    if(!resp.ok){ setSyncStatus('error'); return null; }
    const j = await resp.json();
    setSyncStatus('ok');
    return (j && typeof j === 'object') ? j : null;
  } catch(_){
    setSyncStatus('error');
    return null;
  }
}

const Storage = {
  driver:'memory', db:null, mem:Object.create(null), ready:false,
  async init(){
    this._cleanup();
    try { this.db = await this._openIDB(); this.driver='idb'; this.ready=true; return; } catch(_){ this.db=null; }
    try {
      const k='__t_'+Math.random().toString(36).slice(2,8);
      localStorage.setItem(k,'1');
      if(localStorage.getItem(k)!=='1') throw 0;
      localStorage.removeItem(k);
      this.driver='local'; this.ready=true; return;
    } catch(_){}
    try {
      const k='__t_'+Math.random().toString(36).slice(2,8);
      sessionStorage.setItem(k,'1'); sessionStorage.removeItem(k);
      this.driver='session'; this.ready=true; return;
    } catch(_){}
    this.driver='memory'; this.ready=true;
  },
  _openIDB(){
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('tasks_db',1); } catch(e){ rej(e); return; }
      const t = setTimeout(() => { try { req.onerror = req.onsuccess = req.onupgradeneeded = null; } catch(_){} rej(new Error('timeout')); }, 2500);
      req.onerror = () => { clearTimeout(t); rej(req.error||new Error('err')); };
      req.onsuccess = () => { clearTimeout(t); res(req.result); };
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
    });
  },
  _cleanup(){
    try {
      const kill = (s) => {
        const all = [];
        try { for(let i=0;i<s.length;i++) all.push(s.key(i)); } catch(_){ return; }
        for(const k of all){
          if(!k || k === STORAGE_KEY || k === SYNC_CFG_KEY) continue;
          if(k.indexOf('asciitask.')===0 || k.indexOf('tasks_')===0 || k.indexOf('tasks.')===0 ||
             k.indexOf('__t_')===0 || k === '__asc_test__'){
            try { s.removeItem(k); } catch(_){}
          }
        }
      };
      kill(localStorage); kill(sessionStorage);
    } catch(_){}
  },
  async get(k){
    if(this.driver==='idb') return new Promise(res => {
      try {
        const r = this.db.transaction('kv','readonly').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result == null ? null : String(r.result));
        r.onerror = () => res(null);
      } catch(_){ res(null); }
    });
    if(this.driver==='local'){ try { return localStorage.getItem(k); } catch(_){ return null; } }
    if(this.driver==='session'){ try { return sessionStorage.getItem(k); } catch(_){ return null; } }
    return this.mem[k] != null ? this.mem[k] : null;
  },
  async set(k, v){
    if(this.driver==='idb'){
      try {
        await new Promise((res, rej) => {
          const r = this.db.transaction('kv','readwrite').objectStore('kv').put(v, k);
          r.onsuccess = () => res(); r.onerror = () => rej(r.error);
        });
        return true;
      } catch(_){ this.mem[k]=v; return false; }
    }
    if(this.driver==='local'){
      try { localStorage.setItem(k,v); return true; }
      catch(_){
        try { this.db = await this._openIDB(); this.driver='idb'; return this.set(k,v); }
        catch(_){ this.mem[k]=v; return false; }
      }
    }
    if(this.driver==='session'){
      try { sessionStorage.setItem(k,v); return true; }
      catch(_){ this.mem[k]=v; return false; }
    }
    this.mem[k]=v; return false;
  }
};

const state = {
  tasks: [],
  selectedTaskId: null,
  selectedTaskIds: new Set(),
  lastClickedTaskId: null,
  multiMode: false,

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return dateStr(new Date()); }
function localDateTimeStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    +'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function nowStr(){ return localDateTimeStr(new Date()); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function formatSize(n){
  if(n==null) return '';
  if(n<1024) return n+'B';
  if(n<1024*1024) return (n/1024).toFixed(1)+'K';
  return (n/1024/1024).toFixed(1)+'M';
}
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function formatGroupDate(ds){
  if(ds === 'no-date' || !DATE_RE.test(ds)) return 'no date';
  const [y,m,d]=ds.split('-');
  const date = new Date(parseInt(y,10), parseInt(m,10)-1, parseInt(d,10));
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayName = dayNames[date.getDay()];
  let label = d + '.' + m + '.' + y.slice(2) + ' · ' + dayName;
  if(ds === todayStr()) label += ' · today';
  else {
    const t = new Date(); t.setDate(t.getDate()+1);
    if(ds === dateStr(t)) label += ' · tomorrow';
  }
  return label;
}
function getDateClass(ds){
  if(ds === 'no-date' || !DATE_RE.test(ds)) return '';
  if(ds === todayStr()) return 'dh-today';
  if(ds < todayStr()) return 'dh-past';
  return 'dh-future';
}
function effectiveTime(t){ return t.dueTime || DEFAULT_TIME; }

function isTaskOverdue(t){
  if(!t || t.done || !t.dueDate) return false;
  return t.dueDate < todayStr();
}

function hasWord(text, word){
  if(!text || !word) return false;
  const lower = text.toLowerCase();
  const wl = word.toLowerCase();
  let from = 0;
  while(true){
    const idx = lower.indexOf(wl, from);
    if(idx < 0) return false;
    const before = idx === 0 ? ' ' : lower[idx-1];
    const after = idx + wl.length >= lower.length ? ' ' : lower[idx + wl.length];
    const isWord = (c) => /[\p{L}\p{N}]/u.test(c);
    if(!isWord(before) && !isWord(after)) return true;
    from = idx + 1;
  }
}
function stripWord(text, word){
  try {
    const re = new RegExp('(?<![\\p{L}\\p{N}])' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\p{L}\\p{N}])', 'giu');
    return text.replace(re, ' ');
  } catch(_){
    const lower = text.toLowerCase();
    const wl = word.toLowerCase();
    let from = 0, result = '', idx;
    while((idx = lower.indexOf(wl, from)) >= 0){
      const before = idx === 0 ? ' ' : lower[idx-1];
      const after = idx + wl.length >= lower.length ? ' ' : lower[idx + wl.length];
      const isWord = (c) => /[\p{L}\p{N}]/u.test(c);
      if(!isWord(before) && !isWord(after)){
        result += text.slice(from, idx) + ' ';
        from = idx + wl.length;
      } else from = idx + 1;
    }
    result += text.slice(from);
    return result;
  }
}

const MONTHS_MAP = {
  'января':1,'январь':1,'янв':1,
  'февраля':2,'февраль':2,'фев':2,
  'марта':3,'март':3,'мар':3,
  'апреля':4,'апрель':4,'апр':4,
  'мая':5,'май':5,
  'июня':6,'июнь':6,'июн':6,
  'июля':7,'июль':7,'июл':7,
  'августа':8,'август':8,'авг':8,
  'сентября':9,'сентябрь':9,'сент':9,'сен':9,
  'октября':10,'октябрь':10,'окт':10,
  'ноября':11,'ноябрь':11,'нояб':11,'ноя':11,
  'декабря':12,'декабрь':12,'дек':12,
  'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,'july':7,'august':8,'september':9,'october':10,'november':11,'december':12,
  'jan':1,'feb':2,'mar':3,'apr':4,'jun':6,'jul':7,'aug':8,'sep':9,'sept':9,'oct':10,'nov':11,'dec':12,
};
const MONTH_ALT = Object.keys(MONTHS_MAP).sort((a,b)=>b.length-a.length).join('|');

const _WB_L = '(?<![\\p{L}\\p{N}])';
const _WA_L = '(?![\\p{L}\\p{N}])';
const _WB_D = '(?<!\\d)';
const _WA_D = '(?!\\d)';
const TOKEN_PATTERN_STR = [
  _WB_L + '(?:послезавтра|завтра|сегодня|tomorrow|today)' + _WA_L,
  _WB_L + '\\d{4}-\\d{2}-\\d{2}' + _WA_L,
  _WB_L + '\\d{1,2}[./]\\d{1,2}(?:[./]\\d{4})?' + _WA_L,
  _WB_L + '\\+\\d+d' + _WA_L,
  _WB_L + '\\d{1,2}[.\\s]+(?:' + MONTH_ALT + ')(?:[,\\s]+\\d{4})?' + _WA_L,
  _WB_L + '(?:' + MONTH_ALT + ')[.\\s]+\\d{1,2}(?:[,\\s]+\\d{4})?' + _WA_L,
  _WB_D + '(?:в|at)\\s+(?:[01]?\\d|2[0-3]):[0-5]\\d' + _WA_D,
  _WB_D + '(?:[01]?\\d|2[0-3]):[0-5]\\d' + _WA_D
].join('|');
const TOKEN_RE = new RegExp(TOKEN_PATTERN_STR, 'giu');

let qaRejectedTokens = new Set();

function getTokenAtPosition(text, pos){
  if(!text) return null;
  TOKEN_RE.lastIndex = 0;
  let m;
  while((m = TOKEN_RE.exec(text)) !== null){
    if(pos >= m.index && pos < m.index + m[0].length){
      return m[0];
    }
    if(m[0].length === 0) TOKEN_RE.lastIndex++;
  }
  return null;
}

function buildMirrorHtml(text, skipSet){
  if(!text) return '';
  const out = [];
  let last = 0;
  TOKEN_RE.lastIndex = 0;
  let m;
  while((m = TOKEN_RE.exec(text)) !== null){
    if(m.index > last) out.push(escapeHtml(text.slice(last, m.index)));
    if(skipSet && skipSet.has(m[0])){
      out.push(escapeHtml(m[0]));
    } else {
      out.push('<span class="hl">' + escapeHtml(m[0]) + '</span>');
    }
    last = m.index + m[0].length;
    if(m[0].length === 0) TOKEN_RE.lastIndex++;
  }
  if(last < text.length) out.push(escapeHtml(text.slice(last)));
  return out.join('');
}

function parseTitleNaturalSkipping(title, skipSet){
  if(!skipSet || skipSet.size === 0) return parseTitleNatural(title);
  let work = title;
  const placeholders = [];
  const sortedRejected = Array.from(skipSet).sort((a,b) => b.length - a.length);
  for(const tok of sortedRejected){
    if(!work.includes(tok)) continue;
    const ph = '\u0001' + placeholders.length + '\u0002';
    placeholders.push({ph, orig: tok});
    work = work.split(tok).join(ph);
  }
  const result = parseTitleNatural(work);
  let cleaned = result.cleanedTitle;
  for(const {ph, orig} of placeholders){
    cleaned = cleaned.split(ph).join(orig);
  }
  return {
    dueDate: result.dueDate,
    dueTime: result.dueTime,
    cleanedTitle: cleaned
  };
}

function updateMirror(){
  const inp = document.getElementById('quick-input');
  const mirror = document.getElementById('qa-mirror');
  if(!inp || !mirror) return;
  const text = inp.value;
  if(!text){ mirror.innerHTML = ''; return; }

  for(const tok of Array.from(qaRejectedTokens)){
    if(!text.includes(tok)) qaRejectedTokens.delete(tok);
  }

  const parsed = parseTitleNaturalSkipping(text, qaRejectedTokens);
  if(parsed.dueDate === undefined && parsed.dueTime === undefined){
    mirror.innerHTML = escapeHtml(text);
    return;
  }
  mirror.innerHTML = buildMirrorHtml(text, qaRejectedTokens);
  mirror.style.transform = 'translateX(' + (-inp.scrollLeft) + 'px)';
}

function makeDateStr(y, m, d){
  if(!y || m<1 || m>12 || d<1 || d>31) return null;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return dateStr(dt);
}
function buildDateFromMonth(year, month, day){
  if(!month || !day || day<1 || day>31) return null;
  const now = new Date();
  let y = year || now.getFullYear();
  let dt = new Date(y, month-1, day);
  if(dt.getMonth() !== month-1 || dt.getDate() !== day) return null;
  if(!year){
    const today = new Date(); today.setHours(0,0,0,0);
    const cand = new Date(y, month-1, day); cand.setHours(0,0,0,0);
    if(cand < today){
      y += 1;
      dt = new Date(y, month-1, day);
      if(dt.getMonth() !== month-1 || dt.getDate() !== day) return null;
    }
  }
  return dt;
}
function parseMonthDate(text){
  const lower = text.toLowerCase();
  let re = new RegExp('(?:^|[\\s,.]) *(\\d{1,2})[\\s.]+(' + MONTH_ALT + ')(?:[\\s,]+(\\d{4}))?[.,]?(?=\\s|$)');
  let m = lower.match(re);
  if(m){
    const day = parseInt(m[1],10);
    const mon = MONTHS_MAP[m[2]];
    const year = m[3] ? parseInt(m[3],10) : null;
    const dObj = buildDateFromMonth(year, mon, day);
    if(dObj){
      const idx = m.index;
      const len = m[0].length;
      const rest = (text.slice(0, idx) + ' ' + text.slice(idx + len)).replace(/\s+/g,' ').trim();
      return { date: dateStr(dObj), rest };
    }
  }
  re = new RegExp('(?:^|[\\s,.]) *(' + MONTH_ALT + ')[\\s.]+(\\d{1,2})(?:[\\s,]+(\\d{4}))?[.,]?(?=\\s|$)');
  m = lower.match(re);
  if(m){
    const mon = MONTHS_MAP[m[1]];
    const day = parseInt(m[2],10);
    const year = m[3] ? parseInt(m[3],10) : null;
    const dObj = buildDateFromMonth(year, mon, day);
    if(dObj){
      const idx = m.index;
      const len = m[0].length;
      const rest = (text.slice(0, idx) + ' ' + text.slice(idx + len)).replace(/\s+/g,' ').trim();
      return { date: dateStr(dObj), rest };
    }
  }
  return null;
}

function parseTitleNatural(title){
  const r = { dueDate: undefined, dueTime: undefined, cleanedTitle: title || '' };
  if(!title) return r;
  let work = title;

  const tm = work.match(/(?:^|[^\d])((?:[01]?\d|2[0-3]):[0-5]\d)(?:[^\d]|$)/);
  if(tm){
    const [hh, mm] = tm[1].split(':');
    r.dueTime = hh.padStart(2,'0') + ':' + mm;
    const timeStr = tm[1];
    const esc = timeStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const withPrefix = new RegExp('(?:^|\\s)(?:в|at)\\s+' + esc, 'i');
    if(withPrefix.test(work)){
      work = work.replace(withPrefix, ' ');
    } else {
      work = work.replace(timeStr, ' ');
    }
  }

  const dateWords = [
    { word: 'послезавтра', offset: 2 },
    { word: 'завтра', offset: 1 },
    { word: 'сегодня', offset: 0 },
    { word: 'tomorrow', offset: 1 },
    { word: 'today', offset: 0 }
  ];
  let dateMatched = false;
  for(const dw of dateWords){
    if(hasWord(work, dw.word)){
      const d = new Date();
      d.setDate(d.getDate() + dw.offset);
      r.dueDate = dateStr(d);
      work = stripWord(work, dw.word);
      dateMatched = true;
      break;
    }
  }
  if(!dateMatched){
    let done = false;
    let m;
    if((m = work.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))){
      const ds = makeDateStr(parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10));
      if(ds){ r.dueDate = ds; work = work.replace(m[0], ' '); done = true; }
    }
    if(!done && (m = work.match(/\b(\d{1,2})[./](\d{1,2})(?:[./](\d{4}))?\b/))){
      const y = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
      const ds = makeDateStr(y, parseInt(m[2],10), parseInt(m[1],10));
      if(ds){ r.dueDate = ds; work = work.replace(m[0], ' '); done = true; }
    }
    if(!done && (m = work.match(/\+(\d+)d\b/))){
      const d = new Date(); d.setDate(d.getDate()+parseInt(m[1],10));
      r.dueDate = dateStr(d);
      work = work.replace(m[0], ' ');
      done = true;
    }
    if(!done){
      const md = parseMonthDate(work);
      if(md){ r.dueDate = md.date; work = md.rest; }
    }
  }

  r.cleanedTitle = work.replace(/\s+/g, ' ').trim();
  return r;
}

function mdInline(s){
  let h = escapeHtml(s);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<i>$2</i>');
  h = h.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{
    const safe=/^(https?:|mailto:|\/|#|www\.)/i.test(u);
    return safe ? '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>' : t;
  });
  h = h.replace(/(^|[^"'>])(https?:\/\/[^\s<>"']+)/g, (m,pre,u) => pre + '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
  return h;
}
function getPreviewHtml(desc){
  if(!desc) return '';
  for(const line of desc.split('\n')){
    if(!line.trim()) continue;
    if(line.trim().startsWith('```')) continue;
    if(line.trim().startsWith('@attach:')) continue;
    if(/^\s*-{3,}\s*$/.test(line)) continue;
    const s = line.replace(/^#{1,6}\s+/,'')
      .replace(/^\s*[-*+]\s+\[[ xX]\]\s*/,'')
      .replace(/^\s*[-*+]\s+/,'')
      .replace(/^\s*\d+\.\s+/,'')
      .replace(/^\s*[a-zA-Z]+\.\s+/,'');
    if(!s) continue;
    return mdInline(s);
  }
  return '';
}
function mdToEditorHtml(md){
  if(!md) return '<div><br></div>';
  const lines = md.split('\n');
  let html='', inCode=false, codeBuf=[];
  for(const line of lines){
    if(line.trim().startsWith('```')){
      if(inCode){ html += '<div class="md-pre">'+escapeHtml(codeBuf.join('\n'))+'</div>'; codeBuf=[]; inCode=false; }
      else inCode=true;
      continue;
    }
    if(inCode){ codeBuf.push(line); continue; }
    if(/^\s*-{3,}\s*$/.test(line)){ html += '<hr class="md-hr">'; continue; }
    let m;
    if((m = line.match(/^@attach:(\S+)$/))){
      html += '<div class="md-att" contenteditable="false" draggable="true" data-att-id="'+escapeHtml(m[1])+'"></div>';
      continue;
    }
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){
      html += '<div class="md-h'+m[1].length+'">'+mdInline(m[2])+'</div>';
      continue;
    }
    if((m=line.match(/^(\s*)[-*+]\s+\[([ xX])\]\s+(.*)$/))){
      const level = Math.floor(m[1].length / 2);
      const checked=m[2].toLowerCase()==='x';
      const content = m[3];
      html += '<div class="md-check'+(checked?' done':'')+'" data-check="'+(checked?'1':'0')+'" data-indent="'+level+'" style="margin-left:'+(level*20)+'px">'+
        '<span class="md-chk" contenteditable="false">['+(checked?'x':' ')+']</span> '+
        (content && content.trim() ? mdInline(content) : '<br>')+
        '</div>';
      continue;
    }
    if((m=line.match(/^(\s*)([-*+]|\d+\.|[a-zA-Z]+\.)(?:\s+(.*)|$)/))){
      const level = Math.floor(m[1].length / 2);
      const marker = m[2];
      const isOrdered = /^[\dA-Za-z]+\.$/.test(marker);
      const content = m[3] || '';
      const cls = 'md-li' + (isOrdered ? ' md-ol' : '');
      const markerAttr = isOrdered ? ' data-marker="'+marker+'"' : '';
      html += '<div class="'+cls+'" data-indent="'+level+'"'+markerAttr+' style="margin-left:'+(level*20)+'px">'+
        (content && content.trim() ? mdInline(content) : '<br>')+
        '</div>';
      continue;
    }
    const wsMatch = line.match(/^(\s*)/);
    const lead = wsMatch ? wsMatch[1] : '';
    const level = Math.floor(lead.length / 2);
    const lineText = line.slice(lead.length);
    if(!lineText.trim()){ html += '<div><br></div>'; continue; }
    html += '<div class="md-p" data-indent="'+level+'" style="margin-left:'+(level*20)+'px">'+mdInline(lineText)+'</div>';
  }
  if(inCode) html += '<div class="md-pre">'+escapeHtml(codeBuf.join('\n'))+'</div>';
  return html || '<div><br></div>';
}
function divToMdInline(el){
  let out='';
  function walk(node){
    if(node.nodeType===3){ out+=node.nodeValue; return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName.toLowerCase();
    if(tag==='br') return;
    if(node.classList && node.classList.contains('md-chk')) return;
    if(tag==='hr') return;
    if(tag==='b'||tag==='strong'){ out+='**'; walkKids(node); out+='**'; return; }
    if(tag==='i'||tag==='em'){ out+='*'; walkKids(node); out+='*'; return; }
    if(tag==='s'||tag==='strike'||tag==='del'){ out+='~~'; walkKids(node); out+='~~'; return; }
    if(tag==='code'){ out+='`'; walkKids(node); out+='`'; return; }
    if(tag==='a'){ out+='['; walkKids(node); out+=']('+(node.getAttribute('href')||'')+')'; return; }
    if(tag==='span'){
      const fw=node.style.fontWeight, fs=node.style.fontStyle;
      const td=node.style.textDecoration||node.style.textDecorationLine;
      if(fw==='bold'||fw==='700'||fw==='bolder') out+='**';
      if(fs==='italic') out+='*';
      if(td && td.indexOf('line-through')>=0) out+='~~';
      walkKids(node);
      if(td && td.indexOf('line-through')>=0) out+='~~';
      if(fs==='italic') out+='*';
      if(fw==='bold'||fw==='700'||fw==='bolder') out+='**';
      return;
    }
    walkKids(node);
  }
  function walkKids(node){ for(let i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]); }
  walkKids(el);
  return out;
}
function htmlToMd(root){
  const lines=[];
  for(let i=0;i<root.children.length;i++){
    const div = root.children[i];
    if(div.tagName === 'HR'){ lines.push('---'); continue; }
    const cls = div.className||'';
    if(div.classList && div.classList.contains('md-att')){
      const id = div.dataset.attId || '';
      if(id) lines.push('@attach:' + id);
      continue;
    }
    const text = divToMdInline(div);
    const level = parseInt(div.dataset.indent || '0', 10) || 0;
    const indent = '  '.repeat(level);

    if(cls.includes('md-pre')){ lines.push('```'); lines.push(div.textContent); lines.push('```'); continue; }
    const h = cls.match(/md-h([1-3])/);
    if(h){ lines.push('#'.repeat(parseInt(h[1],10))+' '+text); continue; }
    if(cls.includes('md-check')){
      const checked = div.getAttribute('data-check')==='1';
      const t = text.replace(/^\s*\[[ xX]\]\s*/,'').trim();
      lines.push(indent + '- ['+(checked?'x':' ')+'] '+t);
      continue;
    }
    if(cls.includes('md-li')){
      if(cls.includes('md-ol')){
        const marker = div.dataset.marker || '1.';
        lines.push(indent + marker + ' ' + text.trim());
      } else {
        lines.push(indent + '- ' + text.trim());
      }
      continue;
    }
    if(!text.trim()){ lines.push(''); continue; }
    lines.push(indent + text);
  }
  return lines.join('\n');
}

function newTask(over){
  return Object.assign({
    id: uid(), parentId: null, title: '', description: '',
    attachments: [], done: false, priority: 0,
    dueDate: todayStr(), dueTime: DEFAULT_TIME, dueTimeExplicit: false,
    nextReminderAt: null, reminderDone: false,
    createdAt: Date.now(), completedAt: null,
    order: Date.now(),
  }, over||{});
}
function normalizeTask(t){
  if(!t || typeof t !== 'object') return null;
  if(t.reminder !== undefined && t.dueDate === undefined){
    if(typeof t.reminder==='string' && t.reminder.includes('T')){
      const p=t.reminder.split('T'); t.dueDate=p[0]||null; t.dueTime=p[1]||null;
    } else if(typeof t.reminder==='string'){ t.dueDate=t.reminder||null; t.dueTime=null; }
    else { t.dueDate=null; t.dueTime=null; }
  }
  delete t.reminder;
  if(typeof t.dueDate!=='string' || !t.dueDate) t.dueDate=null;
  if(typeof t.dueTime!=='string' || !t.dueTime) t.dueTime=null;
  if(typeof t.dueTimeExplicit !== 'boolean'){
    t.dueTimeExplicit = !!t.dueTime && t.dueTime !== DEFAULT_TIME;
  }
  if(typeof t.nextReminderAt !== 'string') t.nextReminderAt = null;
  if(typeof t.reminderDone !== 'boolean') t.reminderDone = false;
  if(typeof t.parentId!=='string') t.parentId=null;
  if(typeof t.id!=='string') t.id=uid();
  if(typeof t.title!=='string') t.title='';
  if(typeof t.description!=='string') t.description='';
  if(typeof t.priority!=='number') t.priority=0;
  if(typeof t.done!=='boolean') t.done=false;
  if(typeof t.createdAt!=='number') t.createdAt=Date.now();
  if(typeof t.order!=='number') t.order = t.createdAt;
  if(!Array.isArray(t.attachments)) t.attachments=[];
  t.attachments = t.attachments.filter(a=>a&&typeof a==='object').map(a=>({
    id: typeof a.id==='string'?a.id:uid(),
    name: typeof a.name==='string'?a.name:'file',
    type: typeof a.type==='string'?a.type:'application/octet-stream',
    size: typeof a.size==='number'?a.size:0,
    data: typeof a.data==='string'?a.data:null,
  }));
  return t;
}

function parseQuickAdd(text, rejections){
  const task = newTask();
  const nat = parseTitleNaturalSkipping(text, rejections);
  if(nat.dueDate !== undefined) task.dueDate = nat.dueDate;
  if(nat.dueTime !== undefined){ task.dueTime = nat.dueTime; task.dueTimeExplicit = true; }
  let rest = ' '+nat.cleanedTitle+' ';
  rest = rest.replace(/\s!([1-3])(?=\s)/g,(_,n)=>{ task.priority=parseInt(n,10); return ' '; });
  rest = rest.replace(/\sdate:(\S+)/g,(_,d)=>{
    const dl=d.toLowerCase();
    if(dl==='none'){ task.dueDate=null; task.dueTime=null; task.dueTimeExplicit=false; }
    else if(dl==='today') task.dueDate=todayStr();
    else if(dl==='tomorrow'){ const dt=new Date(); dt.setDate(dt.getDate()+1); task.dueDate=dateStr(dt); }
    else { const m=dl.match(/^\+(\d+)d?$/); if(m){ const dt=new Date(); dt.setDate(dt.getDate()+parseInt(m[1],10)); task.dueDate=dateStr(dt); } }
    return ' ';
  });
  rest = rest.replace(/\stime:(\d{1,2}:\d{2})/g,(_,t)=>{ task.dueTime=t.padStart(5,'0'); task.dueTimeExplicit=true; return ' '; });
  task.title = rest.trim().replace(/\s+/g,' ');
  return task;
}

let saveTimer=null;
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer=null; doSave(); }, 250);
}
async function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  await doSave();
}

function buildCloudPayload(now){
  return {
    tasks: state.tasks.map(t => ({
      ...t,
      attachments: (t.attachments || []).map(a => ({
        id: a.id, name: a.name, type: a.type, size: a.size, data: null
      }))
    })),
    updatedAt: now,
    manualSort: state.manualSort,
    collapsed: state.collapsed
  };
}
function mergeAttachData(remoteTasks, localTasks){
  const byId = new Map((localTasks||[]).map(t => [t.id, t]));
  for(const rt of remoteTasks){
    if(!rt || !Array.isArray(rt.attachments)) continue;
    const lt = byId.get(rt.id);
    if(!lt || !Array.isArray(lt.attachments)) continue;
    for(const a of rt.attachments){
      if(a && (a.data == null || a.data === '')){
        const la = lt.attachments.find(x => x && x.id === a.id);
        if(la && la.data != null) a.data = la.data;
      }
    }
  }
  return remoteTasks;
}

async function doSave(){
  if(!Storage.ready) return;
  const now = Date.now();
  const localPayload = { tasks: state.tasks, updatedAt: now, manualSort: state.manualSort, collapsed: state.collapsed };
  try { await Storage.set(STORAGE_KEY, JSON.stringify(localPayload)); } catch(_){}
  localDirty = true;
  if(syncBusy) return;
  if(!hasSyncCreds()) return;
  syncBusy = true;
  try {
    const ok = await cloudPut(buildCloudPayload(now));
    if(ok){
      cloudUpdatedAt = now;
      localDirty = false;
    }
  } finally {
    syncBusy = false;
  }
}

async function load(){
  try {
    const rawSync = await Storage.get(SYNC_CFG_KEY);
    if(rawSync){
      const s = JSON.parse(rawSync);
      if(s && typeof s === 'object'){
        syncCfg.binId = typeof s.binId === 'string' ? s.binId : '';
        syncCfg.masterKey = typeof s.masterKey === 'string' ? s.masterKey : '';
      }
    }
  } catch(_){}

  let localTs = 0;
  try {
    const raw = await Storage.get(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.tasks)) state.tasks = d.tasks.map(normalizeTask).filter(Boolean);
      if(typeof d.updatedAt === 'number') localTs = d.updatedAt;
      if(d.manualSort && typeof d.manualSort === 'object') state.manualSort = d.manualSort;
      if(d.collapsed && typeof d.collapsed === 'object') state.collapsed = d.collapsed;
    }
  } catch(_){}
  cloudUpdatedAt = localTs;

  if(!hasSyncCreds()) return;

  const remote = await cloudGet();
  if(remote && Array.isArray(remote.tasks) && remote.tasks.length > 0){
    const remoteTs = typeof remote.updatedAt === 'number' ? remote.updatedAt : 0;
    if(remoteTs > localTs){
      const remoteNorm = remote.tasks.map(normalizeTask).filter(Boolean);
      state.tasks = mergeAttachData(remoteNorm, state.tasks);
      if(remote.manualSort && typeof remote.manualSort === 'object') state.manualSort = remote.manualSort;
      if(remote.collapsed && typeof remote.collapsed === 'object') state.collapsed = remote.collapsed;
      cloudUpdatedAt = remoteTs;
      try { await Storage.set(STORAGE_KEY, JSON.stringify({ tasks: state.tasks, updatedAt: remoteTs, manualSort: state.manualSort, collapsed: state.collapsed })); } catch(_){}
      return;
    }
  }

  if(state.tasks.length > 0){
    const now = Date.now();
    const ok = await cloudPut(buildCloudPayload(now));
    if(ok){
      cloudUpdatedAt = now;
      try { await Storage.set(STORAGE_KEY, JSON.stringify({ tasks: state.tasks, updatedAt: now, manualSort: state.manualSort, collapsed: state.collapsed })); } catch(_){}
    }
  }
}

async function cloudPull(){
  if(syncBusy || localDirty) return;
  if(!hasSyncCreds()) return;
  syncBusy = true;
  try {
    const remote = await cloudGet();
    if(!remote || !Array.isArray(remote.tasks)) return;
    const remoteTs = typeof remote.updatedAt === 'number' ? remote.updatedAt : 0;
    if(remoteTs <= cloudUpdatedAt) return;

    const remoteNorm = remote.tasks.map(normalizeTask).filter(Boolean);
    state.tasks = mergeAttachData(remoteNorm, state.tasks);
    if(remote.manualSort && typeof remote.manualSort === 'object') state.manualSort = remote.manualSort;
    if(remote.collapsed && typeof remote.collapsed === 'object') state.collapsed = remote.collapsed;
    cloudUpdatedAt = remoteTs;
    try { await Storage.set(STORAGE_KEY, JSON.stringify({ tasks: state.tasks, updatedAt: remoteTs, manualSort: state.manualSort, collapsed: state.collapsed })); } catch(_){}

    if(state.selectedTaskId && !state.tasks.find(x=>x.id===state.selectedTaskId)){
      state.selectedTaskId = null;
      renderEditor();
    }
    renderList();
  } finally {
    syncBusy = false;
  }
}

}

async function testSync(){
  if(!hasSyncCreds()){ setSyncStatus('unset'); return; }
  const remote = await cloudGet();
  if(remote){
    if(Array.isArray(remote.tasks) && remote.tasks.length > 0){
      const remoteTs = typeof remote.updatedAt === 'number' ? remote.updatedAt : 0;
      let localTs = 0;
      try {
        const raw = await Storage.get(STORAGE_KEY);
        if(raw){ const d = JSON.parse(raw); if(typeof d.updatedAt === 'number') localTs = d.updatedAt; }
      } catch(_){}
      if(remoteTs > localTs){
        const remoteNorm = remote.tasks.map(normalizeTask).filter(Boolean);
        state.tasks = mergeAttachData(remoteNorm, state.tasks);
        if(remote.manualSort && typeof remote.manualSort === 'object') state.manualSort = remote.manualSort;
        if(remote.collapsed && typeof remote.collapsed === 'object') state.collapsed = remote.collapsed;
        cloudUpdatedAt = remoteTs;
        try { await Storage.set(STORAGE_KEY, JSON.stringify({ tasks: state.tasks, updatedAt: remoteTs, manualSort: state.manualSort, collapsed: state.collapsed })); } catch(_){}
        render();
      } else {
        await doSave();
      }
    } else {
      await doSave();
    }
    return;
  }
  const ok = await cloudPut(buildCloudPayload(Date.now()));
  if(ok){
    cloudUpdatedAt = Date.now();
    localDirty = false;
  }
}

function isAncestorOf(a, n){
  if(a===n) return true;
  let cur = state.tasks.find(t=>t.id===n);
  const seen=new Set();
  while(cur && cur.parentId){
    if(seen.has(cur.id)) return false;
    seen.add(cur.id);
    if(cur.parentId===a) return true;
    cur = state.tasks.find(t=>t.id===cur.parentId);
  }
  return false;
}
function propagateDate(task){
  for(const c of state.tasks){
    if(c.parentId===task.id){
      c.dueDate=task.dueDate;
      propagateDate(c);
    }
  }
}
function resetReminder(t){
  t.reminderDone = false;
  t.nextReminderAt = null;
  if(t.dueDate){
    const at = t.dueDate + 'T' + effectiveTime(t);
    if(at <= nowStr()) t.reminderDone = true;
  }
}

function addTask(task){
  if(!task.reminderDone){
    const at = task.nextReminderAt || (task.dueDate ? task.dueDate + 'T' + effectiveTime(task) : null);
    if(at && at <= nowStr()) task.reminderDone = true;
  }
  state.tasks.push(task);
  scheduleSave(); render();
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const newDone = !t.done;

  (function markDown(task, done){
    task.done = done;
    task.completedAt = done ? Date.now() : null;
    if(done) resetReminder(task);
    for(const c of state.tasks){
      if(c.parentId === task.id) markDown(c, done);
    }
  })(t, newDone);

  if(newDone){
    let cur = t;
    while(cur.parentId){
      const parent = state.tasks.find(x=>x.id===cur.parentId);
      if(!parent) break;
      const kids = state.tasks.filter(x=>x.parentId===parent.id);
      if(kids.length && kids.every(k=>k.done)){
        if(!parent.done){
          parent.done = true;
          parent.completedAt = Date.now();
          resetReminder(parent);
        }
        cur = parent;
      } else break;
    }
  } else {
    let cur = t;
    while(cur.parentId){
      const parent = state.tasks.find(x=>x.id===cur.parentId);
      if(!parent) break;
      if(parent.done){
        parent.done = false;
        parent.completedAt = null;
      }
      cur = parent;
    }
  }

  scheduleSave(); render();
}

function deleteTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const kill = new Set([id]);
  let changed = true;
  while(changed){
    changed=false;
    for(const x of state.tasks){
      if(x.parentId && kill.has(x.parentId) && !kill.has(x.id)){ kill.add(x.id); changed=true; }
    }
  }
  const removed = state.tasks.filter(x=>kill.has(x.id));
  state.tasks = state.tasks.filter(x=>!kill.has(x.id));
  if(state.selectedTaskId && kill.has(state.selectedTaskId)) state.selectedTaskId = null;
  for(const r of removed) state.selectedTaskIds.delete(r.id);
  scheduleSave(); render();
  toast('deleted: '+(t.title||'task'), {
    label: 'undo',
    onClick: () => {
      state.tasks.push(...removed);
      scheduleSave(); render();
      toast('restored');
    }
  });
}

function clearCompleted(){

    const parentFix = [];
    state.tasks = state.tasks.filter(t => !t.done);
    const remainingIds = new Set(state.tasks.map(t => t.id));
    for(const t of state.tasks){
      if(t.parentId && !remainingIds.has(t.parentId)){
        parentFix.push({ t, parentId: t.parentId });
        t.parentId = null;
      }
    }
    if(state.selectedTaskId && doneIds.has(state.selectedTaskId)) state.selectedTaskId = null;
    for(const id of doneIds) state.selectedTaskIds.delete(id);
    scheduleSave(); render();
    toast('cleared ' + n + ' completed', {

        state.tasks.push(...doneTasks);
        for(const p of parentFix) p.t.parentId = p.parentId;
        scheduleSave(); render();
        toast('restored');
      }
    });
  });
}

  const parent = state.tasks.find(x=>x.id===parentId);
  if(!child || !parent) return false;

function getSiblingInfo(t){
  if(t.parentId){
    return {
      sortKey: 'parent:' + t.parentId,
      group: state.tasks.filter(x => x.parentId === t.parentId),
    };
  }
  const dateKey = t.dueDate || 'no-date';
  return {
    sortKey: dateKey,
    group: state.tasks.filter(x => (x.dueDate || 'no-date') === dateKey && !x.parentId),
  };
}

function reorderTask(draggedId, targetId, before){
  const dragged = state.tasks.find(t => t.id === draggedId);
  const target = state.tasks.find(t => t.id === targetId);
  if(!dragged || !target) return;

  const draggedInfo = getSiblingInfo(dragged);
  const targetInfo = getSiblingInfo(target);
  if(draggedInfo.sortKey !== targetInfo.sortKey) return;

  const sortKey = draggedInfo.sortKey;
  const groupTasks = draggedInfo.group;
  const isManual = !!state.manualSort[sortKey];

  groupTasks.sort((a,b) => {
    if(isManual) return (a.order || a.createdAt) - (b.order || b.createdAt);
    if(dragged.parentId){
      return (a.order || a.createdAt) - (b.order || b.createdAt);
    }
    const ta = effectiveTime(a), tb = effectiveTime(b);
    if(ta !== tb) return ta.localeCompare(tb);
    return b.priority - a.priority || (a.order || a.createdAt) - (b.order || b.createdAt);
  });

  const base = Date.now();
  groupTasks.forEach((t, i) => { t.order = base + i; });

  const filtered = groupTasks.filter(t => t.id !== draggedId);
  const tIdx = filtered.findIndex(t => t.id === targetId);
  if(tIdx < 0) return;

  const insertAt = before ? tIdx : tIdx + 1;
  const prev = filtered[insertAt - 1];
  const next = filtered[insertAt];

  const prevOrder = prev ? prev.order : (next ? next.order - 2 : base - 1);
  const nextOrder = next ? next.order : (prevOrder + 2);

  let newOrder;
  if(prev && next) newOrder = (prevOrder + nextOrder) / 2;
  else if(prev) newOrder = prevOrder + 1;
  else if(next) newOrder = nextOrder - 1;
  else newOrder = base;

  dragged.order = newOrder;
  state.manualSort[sortKey] = true;
  scheduleSave();
  renderList();
}

function fillAttachmentBlock(el, a){

    el.innerHTML = '<span class="md-att-handle" contenteditable="false">≡</span><span class="md-att-placeholder">missing attachment</span>';

  } else {

    else if((a.type||'').startsWith('audio/')) icon = '[aud]';
    inner += '<span class="md-att-icon">'+icon+'</span>';
  }
  inner += '<span class="md-att-name">'+escapeHtml(a.name)+'</span>';

  el.innerHTML = inner;
}

function getTopBlockAtCursor(editor){
  if(!editor) return null;
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if(!editor.contains(range.startContainer)) return null;
  let node = range.startContainer;
  if(node.nodeType === 3) node = node.parentNode;
  while(node && node !== editor && node.parentNode !== editor) node = node.parentNode;
  if(node && node !== editor && node.parentNode === editor) return node;
  return null;
}

function updateLastCaretBlock(){
  const editor = document.getElementById('modal-desc');
  if(!editor) return;
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(!editor.contains(range.startContainer)) return;
  let node = range.startContainer;
  if(node.nodeType === 3) node = node.parentNode;
  while(node && node !== editor && node.parentNode !== editor) node = node.parentNode;
  if(node && node !== editor && node.parentNode === editor){
    state.lastCaretBlock = node;
    state.lastCaretIndex = Array.prototype.indexOf.call(editor.children, node);
  }
}

function attachFiles(){
  const editorBeforeOpen = document.getElementById('modal-desc');
  let attachAnchor = getTopBlockAtCursor(editorBeforeOpen);
  if(!attachAnchor && state.lastCaretBlock && state.lastCaretBlock.parentNode === editorBeforeOpen){
    attachAnchor = state.lastCaretBlock;
  }
  let anchorIndex = -1;
  if(attachAnchor && attachAnchor.parentNode === editorBeforeOpen){
    anchorIndex = Array.prototype.indexOf.call(editorBeforeOpen.children, attachAnchor);
  } else if(typeof state.lastCaretIndex === 'number' && state.lastCaretIndex >= 0){
    anchorIndex = state.lastCaretIndex;
  }

  const input = document.createElement('input');
  input.type='file'; input.multiple=true;
  input.onchange = () => {
    const files = [...input.files];
    if(!files.length) return;
    const taskId = state.selectedTaskId;
    if(!taskId) return;
    let remaining = files.length;
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = () => {
        const t = state.tasks.find(x => x.id === taskId);
        if(t){
          const att = {
            id: uid(), name: f.name,
            type: f.type || 'application/octet-stream',
            size: f.size, data: reader.result,
          };
          t.attachments.push(att);
          if(state.selectedTaskId === taskId){
            const ed = document.getElementById('modal-desc');
            if(ed){
              const block = createAttachmentBlock(att);
              let insertAfter = null;
              if(anchorIndex >= 0 && anchorIndex < ed.children.length){
                insertAfter = ed.children[anchorIndex];
              } else if(attachAnchor && attachAnchor.parentNode === ed){
                insertAfter = attachAnchor;
              }
              if(insertAfter){
                ed.insertBefore(block, insertAfter.nextSibling);
              } else {
                ed.appendChild(block);
              }
              anchorIndex = Array.prototype.indexOf.call(ed.children, block);
              state.lastCaretIndex = anchorIndex;
              state.lastCaretBlock = block;
              try { ed.focus(); } catch(_){}
              try {
                const r = document.createRange();
                r.setStartAfter(block);
                r.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(r);
              } catch(_){}
              updateDescFromEditor();
            } else {
              scheduleSave();
            }
          } else {
            scheduleSave();
          }
          renderList();
        }
        if(--remaining===0) toast('attached');
      };
      reader.onerror = () => { if(--remaining===0) toast('read error'); };
      reader.readAsDataURL(f);
    });
  };
  input.click();
}

function saveDescriptionAs(){
  const t = state.selectedTaskId ? state.tasks.find(x=>x.id===state.selectedTaskId) : null;
  if(!t) return;
  const text = t.description || '';
  let defName = (t.title || 'task').trim() || 'task';
  defName = defName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').slice(0, 80);
  if(!/\.[a-z0-9]+$/i.test(defName)) defName += '.txt';

  textPrompt('save as', defName, name => {
    let fn = (name || '').trim();
    if(!fn) fn = defName;
    if(!/\.[a-z0-9]+$/i.test(fn)) fn += '.txt';
    let mime = 'text/plain';
    if(/\.md$/i.test(fn) || /\.markdown$/i.test(fn)) mime = 'text/markdown';
    else if(/\.json$/i.test(fn)) mime = 'application/json';
    else if(/\.html?$/i.test(fn)) mime = 'text/html';
    else if(/\.csv$/i.test(fn)) mime = 'text/csv';
    try {
      const blob = new Blob([text], {type: mime + ';charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fn;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{
        try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch(_){}
      }, 500);
      toast('saved: ' + fn);
    } catch(_){
      toast('save failed');
    }
  });
}

function incrementAlpha(s){
  let result = '';
  let carry = 1;
  for(let i = s.length - 1; i >= 0; i--){
    let code = s.charCodeAt(i) - 96 + carry;
    if(code > 26){
      carry = 1;
      result = String.fromCharCode(96 + (code - 26)) + result;
    } else {
      carry = 0;
      result = String.fromCharCode(96 + code) + result;
    }
  }
  if(carry) result = 'a' + result;
  return result;
}
function getNextMarker(cur){
  if(!cur) return '-';
  if(cur === '-' || cur === '*' || cur === '+') return cur;
  let m = cur.match(/^(\d+)\.$/);
  if(m) return (parseInt(m[1], 10) + 1) + '.';
  m = cur.match(/^([a-z]+)\.$/);
  if(m) return incrementAlpha(m[1]) + '.';
  m = cur.match(/^([A-Z]+)\.$/);
  if(m) return incrementAlpha(m[1].toLowerCase()).toUpperCase() + '.';
  return '1.';
}

function startInlineNew(parentId, location){
  const parent = state.tasks.find(x => x.id === parentId);
  if(!parent) return;
  if(location === 'list'){
    const dateKey = (typeof parent.dueDate === 'string' && DATE_RE.test(parent.dueDate)) ? parent.dueDate : 'no-date';
    if(state.collapsed[dateKey]){ delete state.collapsed[dateKey]; }
  }
  state.pendingNew = { parentId, location };
  render();
}

function commitInlineNew(keepPending){
  const inp = document.querySelector('.inline-new-input');
  if(!inp) return;
  const val = inp.value;
  if(!val.trim()){
    if(!keepPending){
      state.pendingNew = null;
      state._suppressBlur = true;
      render();
      setTimeout(()=>{ state._suppressBlur = false; }, 0);
    }
    return;
  }
  const pending = state.pendingNew;
  if(!pending) return;
  const parent = state.tasks.find(x => x.id === pending.parentId);
  if(!parent){ state.pendingNew = null; render(); return; }
  const nt = newTask({
    parentId: parent.id,
    title: val.trim(),
    dueDate: null,
    dueTime: null,
    dueTimeExplicit: false,
  });
  state.tasks.push(nt);
  scheduleSave();
  state._suppressBlur = true;
  render();
  setTimeout(()=>{ state._suppressBlur = false; }, 0);
}

function cancelInlineNew(){

  state._suppressBlur = true;
  render();
  setTimeout(()=>{ state._suppressBlur = false; }, 0);
}

function renderList(){
  const mc = document.getElementById('main-content');
  if(!mc) return;

  if(state.tasks.length===0){
    mc.innerHTML = '<div class="empty">no tasks</div>';
    renderQuickAdd();
    return;
  }

  const byId = new Map(state.tasks.map(t => [t.id, t]));

  const groups = {};
  const doneRoots = [];
  for(const t of state.tasks){
    let isRoot = true;
    if(t.parentId){
      const p = byId.get(t.parentId);
      if(p && p.done === t.done) isRoot = false;
    }
    if(!isRoot) continue;
    if(t.done){ doneRoots.push(t); continue; }
    const raw = t.dueDate;
    const key = (typeof raw === 'string' && DATE_RE.test(raw)) ? raw : 'no-date';
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  }
  const dates = Object.keys(groups).filter(k=>k!=='no-date').sort();
  if(groups['no-date']) dates.push('no-date');

  let html = '';
  for(const date of dates){
    const roots = groups[date];
    const isManual = !!state.manualSort[date];
    const isCollapsed = !!state.collapsed[date];

    if(isManual){
      roots.sort((a,b) => (a.order || a.createdAt) - (b.order || b.createdAt));
    } else {
      roots.sort((a,b)=>{
        const ta = effectiveTime(a), tb = effectiveTime(b);
        if(ta!==tb) return ta.localeCompare(tb);
        return b.priority - a.priority || (a.order || a.createdAt) - (b.order || b.createdAt);
      });
    }

    let tasksHtml='';
    let count = 0;
    for(const r of roots){
      if(!isCollapsed) tasksHtml += renderTree(r, 0);
      count += countTree(r);
    }

    const dhClass = getDateClass(date);
    const chevron = isCollapsed ? '+' : '−';
    html += '<section class="date-group" data-date="'+date+'">'+
      '<header class="date-header">'+
        '<span class="dh-chevron" data-action="toggle-collapse" data-date="'+escapeHtml(date)+'">'+chevron+'</span>'+
        '<span class="dh-text '+dhClass+'" data-action="toggle-collapse" data-date="'+escapeHtml(date)+'">'+escapeHtml(formatGroupDate(date))+
        ' <span class="count">('+count+')</span></span>'+
        (isManual ? '<button type="button" class="dh-reset" data-action="reset-sort" data-date="'+escapeHtml(date)+'" title="reset sort">↶</button>' : '')+
      '</header>'+
      (isCollapsed ? '' : '<div class="tasks">'+tasksHtml+'</div>')+
      '</section>';
  }

  if(doneRoots.length > 0){
    doneRoots.sort((a,b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));
    const isCollapsed = state.collapsed.done !== false;
    let tasksHtml = '';
    let count = 0;
    for(const r of doneRoots){
      if(!isCollapsed) tasksHtml += renderTree(r, 0);
      count += countTree(r);
    }
    const chevron = isCollapsed ? '+' : '−';
    html += '<section class="date-group done-group" data-date="done">'+
      '<header class="date-header">'+
        '<span class="dh-chevron" data-action="toggle-collapse" data-date="done">'+chevron+'</span>'+
        '<span class="dh-text" data-action="toggle-collapse" data-date="done">done <span class="count">('+count+')</span></span>'+
        '<button type="button" class="dh-trash" data-action="clear-done" title="clear completed">clear</button>'+
      '</header>'+
      (isCollapsed ? '' : '<div class="tasks">'+tasksHtml+'</div>')+
      '</section>';
  }

  mc.innerHTML = html;
  renderQuickAdd();
}

function countTree(task){
  let n = 1;
  for(const c of state.tasks){
    if(c.parentId === task.id && c.done === task.done) n += countTree(c);
  }
  return n;
}

function collectGroupTaskIds(d){
  const byId = new Map(state.tasks.map(t => [t.id, t]));
  const kidsByParent = new Map();
  for(const t of state.tasks){
    if(t.parentId){
      if(!kidsByParent.has(t.parentId)) kidsByParent.set(t.parentId, []);
      kidsByParent.get(t.parentId).push(t);
    }
  }
  const ids = [];
  const walk = (t) => {
    ids.push(t.id);
    const kids = kidsByParent.get(t.id);
    if(kids){
      for(const c of kids){
        if(c.done === t.done) walk(c);
      }
    }
  };
  for(const t of state.tasks){
    let isRoot = true;
    if(t.parentId){
      const p = byId.get(t.parentId);
      if(p && p.done === t.done) isRoot = false;
    }
    if(!isRoot) continue;
    if(d === 'done'){
      if(!t.done) continue;
    } else {
      if(t.done) continue;
      const rootDate = (typeof t.dueDate === 'string' && DATE_RE.test(t.dueDate)) ? t.dueDate : 'no-date';
      if(rootDate !== d) continue;
    }
    walk(t);
  }
  return ids;
}

function renderTree(task, depth){
  let html = renderRow(task, depth);
  const kids = state.tasks.filter(c => c.parentId === task.id && c.done === task.done);
  kids.sort((a,b) => (a.order || a.createdAt) - (b.order || b.createdAt));
  for(const c of kids){
    html += renderTree(c, depth+1);
  }
  if(state.pendingNew && state.pendingNew.parentId === task.id && state.pendingNew.location === 'list'){
    html += renderInlineNewList(depth+1);
  }
  return html;
}

function renderRow(t, depth){
  const prioClass = t.priority===3?' prio-high':t.priority===2?' prio-med':t.priority===1?' prio-low':'';
  const done = t.done?' done':'';
  const isOverdue = isTaskOverdue(t);
  const overdue = isOverdue ? ' overdue' : '';
  const sel = t.id===state.selectedTaskId?' selected':'';
  const multi = state.selectedTaskIds.has(t.id)?' multisel':'';
  const hasNest = depth > 0;
  const cls = 'task-row' + (hasNest ? ' has-nest' : '') + done + prioClass + overdue + sel + multi;
  const check = t.done?'[x]':'[ ]';
  const parts = [];
  if(t.dueDate && t.dueTime && t.dueTimeExplicit){
    parts.push('<span class="time">'+t.dueTime+'</span>');
  }
  if(t.attachments.length){
    const anyUnavail = t.attachments.some(a => !a.data);
    const attCls = anyUnavail ? 'att att-unavail' : 'att';
    parts.push('<span class="'+attCls+'">⎘'+t.attachments.length+'</span>');
  }
  const meta = parts.join('<span class="sep">|</span>');
  const descHtml = getPreviewHtml(t.description);
  const descDiv = descHtml ? '<div class="task-desc">'+descHtml+'</div>' : '';
  const indent = depth*16;
  const nestHtml = hasNest ? '<span class="nest-col">└</span>' : '';
  return '<div class="'+cls+'" style="margin-left:'+indent+'px" tabindex="0" data-action="open-task" data-id="'+t.id+'" data-ctx="task" data-ctx-id="'+t.id+'">'+
    '<span class="drag-handle" data-drag-id="'+t.id+'">≡</span>'+
    nestHtml+
    '<span class="check" data-action="toggle-task" data-id="'+t.id+'">'+check+'</span>'+
    '<div class="task-body">'+
      '<div class="task-title">'+escapeHtml(t.title || '')+'</div>'+
      '<div class="task-meta">'+meta+'</div>'+
      descDiv+
    '</div>'+
  '</div>';
}

function renderNested(taskId, depth, excludeId){
  const kids = state.tasks.filter(t => t.parentId === taskId && t.id !== excludeId);
  if(!kids.length) return '';
  kids.sort((a,b) => (a.order || a.createdAt) - (b.order || b.createdAt));
  let html = '';
  for(const k of kids){
    const prioClass = k.priority===3?' prio-high':k.priority===2?' prio-med':k.priority===1?' prio-low':'';
    const overdueCls = isTaskOverdue(k) ? ' overdue' : '';
    const parts = [];
    if(k.dueDate && k.dueTime && k.dueTimeExplicit){
      parts.push('<span>'+k.dueTime+'</span>');
    }
    if(k.attachments && k.attachments.length){
      const anyUnavail = k.attachments.some(a => !a.data);
      parts.push('<span'+(anyUnavail?' style="color:var(--red)"':'')+'>⎘'+k.attachments.length+'</span>');
    }
    const meta = parts.length
      ? '<span style="color:var(--dim);white-space:nowrap;flex-shrink:0;display:inline-flex;gap:6px;align-items:baseline">'+
          parts.join('<span style="color:var(--dimmer)">|</span>')+
        '</span>'
      : '';
    html += '<div class="nested-item'+(k.done?' done':'')+prioClass+overdueCls+'" data-id="'+k.id+'" data-ctx="task" data-ctx-id="'+k.id+'" style="padding-left:'+(depth*14)+'px">'+
      '<span class="drag-handle" data-drag-id="'+k.id+'">≡</span>'+
      '<span class="nested-check" data-action="toggle-task" data-id="'+k.id+'">'+(k.done?'[x]':'[ ]')+'</span>'+
      '<span class="nested-title" style="flex:1 1 auto;min-width:0">'+escapeHtml(k.title || '(untitled)')+'</span>'+
      meta+
    '</div>';
    html += renderNested(k.id, depth+1, excludeId);
  }
  return html;
}

let priorityRO = null;
let lastRowWidth = -1;

function setupPriorityResize(){
  if(!priorityRO){
    priorityRO = new ResizeObserver(() => { updatePriorityVisibility(); });
  }
  const row = document.querySelector('.compact-row');
  priorityRO.disconnect();
  lastRowWidth = -1;
  if(row){
    priorityRO.observe(row);
    updatePriorityVisibility();
  }
}

function updatePriorityVisibility(){
  const row = document.querySelector('.compact-row');
  if(!row) return;
  const inline = row.querySelector('.prio-inline');
  const dropdown = row.querySelector('.prio-dropdown');
  if(!inline || !dropdown) return;

  const w = Math.round(row.clientWidth);
  if(w === lastRowWidth) return;
  lastRowWidth = w;

  inline.style.display = 'flex';
  dropdown.style.display = 'none';

  const inlineRight = inline.getBoundingClientRect().right;
  const rowRight = row.getBoundingClientRect().right;

  if(inlineRight > rowRight - 2){
    inline.style.display = 'none';
    dropdown.style.display = 'inline-block';
  }
}
